  <p class="section-label">记住这两条 · 考试会考</p>
  <h2 class="heading" style="margin-top:6pt;">「比」的两条规则</h2>
  <div class="task-box" style="margin-top:13pt;">
    <p class="task-line"><b>规则一：</b>「比」后面<b>不用「很」</b>。</p>
    <p class="task-cn"><span class="text-brick">✗ 牛肉比猪肉很贵。</span> &nbsp;→&nbsp; <span class="text-jade">✓ 牛肉比猪肉贵。</span></p>
    <p class="task-line"><b>规则二：</b>B 重复 A 的东西时，留「的」，去掉那个词。</p>
    <p class="task-cn"><span class="text-brick">✗ 我的头发比妹妹的头发长。</span> &nbsp;→&nbsp; <span class="text-jade">✓ 我的头发比妹妹<b>的</b>长。</span></p>
    <p class="task-line"><b>各 的词组（作业本练习七）：</b>各个学校 · 各位老师 · 各家餐厅 · 各种书报 · 各个菜市场 · 各家饭店 · 各种文具 · 各家医院</p>
  </div>
