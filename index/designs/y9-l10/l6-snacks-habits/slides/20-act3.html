<div class="slide-content">
  <p class="section-label">作业本练习十八 + 练习二十三 · 6 分钟</p>
  <h2 class="heading" style="margin-top:6pt;">写一段话 — 说说你吃什么</h2>
  <div class="task-box" style="margin-top:13pt;">
    <p class="task-line"><b>先问一圈：</b>你喜欢吃哪种饭菜？ 你喜欢喝什么饮料？ 每个人都先<b>说</b>一遍再写。</p>
    <p class="task-line"><b>然后写五到六句：</b></p>
    <p class="task-cn">1. 早饭 &nbsp;2. 午饭 &nbsp;3. 晚饭 —— 各一句</p>
    <p class="task-cn">4. 你最喜欢的零食 &nbsp;5. 一句「平时……，但是……」</p>
    <p class="task-line">词汇板留在屏幕上。小结的时候念两篇。</p>
  </div>
  <div class="extension-box">
    <p class="extension-label">Extension · 加分题</p>
    <p class="extension-text">写作业本要求的<b>整整 80–100 字</b>，<b>不看词汇板</b>，还要写上零食<b>在哪里、什么时候</b>吃，以及你的饮食<b>均衡不均衡</b>。这几乎就是<b>单元测验的作文题</b>。</p>
  </div>
