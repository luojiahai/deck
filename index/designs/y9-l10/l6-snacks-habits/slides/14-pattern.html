<!DOCTYPE html>
<html lang="zh-CN"><head>
<meta charset="UTF-8">
<title>Y9 L10 · 句型</title>
<link rel="stylesheet" href="../../shared/tokens.css">
<style>
  /* denser row rhythm — keeps this slide inside the PPTX 0.5in safe margin.
     Spacing only; no font size is reduced. */
  .sentence-list { gap: 8pt; }
  .sentence-row  { padding: 9pt 18pt; }
</style>
</head>
<body>
<div class="slide-header">
  <span class="lesson-tag"><p>10–20 MIN · I DO</p></span>
  <span class="sep"></span>
  <span class="section-name"><p>句型 · 平时……，但是……</p></span>
  <span class="slide-num"><p>14 / 21</p></span>
  <div class="accent-line"></div>
</div>
<div class="slide-content">
  <p class="section-label">今天的句型</p>
  <div class="pattern-box" style="margin-top:10pt;">
    <p class="pattern-text">我 平时 …… ，但是 …… 。</p>
  </div>
  <div class="sentence-list" style="margin-top:17pt;">
    <div class="sentence-row">
      <p class="sentence-cn">我平时八点到学校，但是今天七点就到了。</p>
      <p class="sentence-en">课本 99 页 练习十二 的例句</p>
    </div>
    <div class="sentence-row">
      <p class="sentence-cn">我通常买盒饭，但是今天带了三明治。</p>
    </div>
    <div class="sentence-row">
      <p class="sentence-cn">我一般不吃零食，但是昨天吃了三包薯片。</p>
    </div>
    <div class="sentence-row both">
      <p class="sentence-cn">我平时在学校餐厅买午饭，但是这个星期餐厅关门，所以我从家里带饭。</p>
      <p class="sentence-en">Habit, exception and a reason — this is the one to aim for.</p>
    </div>
  </div>
</div>
</body></html>
