  <div class="sentence-list" style="margin-top:6pt;">
    <div class="sentence-row"><p class="sentence-cn"><span class="text-brick">A：</span>你每天午饭吃什么？</p></div>
    <div class="sentence-row"><p class="sentence-cn"><span class="text-jade">B：</span>我有时候从家里带三明治，有时候在学校餐厅买东西吃。</p></div>
    <div class="sentence-row"><p class="sentence-cn"><span class="text-brick">A：</span>你平时买些什么？</p></div>
    <div class="sentence-row"><p class="sentence-cn"><span class="text-jade">B：</span>我通常买盒饭吃，有时候也会买薯片、薯条、炸鸡翅（膀）、糖果等。</p></div>
    <div class="sentence-row"><p class="sentence-cn"><span class="text-brick">A：</span>盒饭贵吗？多少钱一盒？</p></div>

  </div>
  <p class="support" style="margin-top:10pt;">问：B 平时买什么？ 盒饭多少钱？ 「不算太贵」是贵还是便宜？</p>
