<!DOCTYPE html>
<html lang="zh-CN"><head>
<meta charset="UTF-8">
<title>Y9 L10 · 句型</title>
<link rel="stylesheet" href="../../shared/tokens.css">
<style data-fit="whitespace">
  /* whitespace only - no type size changed */
  .slide-content { padding-top: 16pt; padding-bottom: 16pt; }
  .sentence-list { gap: 9pt; } .stack.gap-md { gap: 9pt; }
  .sentence-row { padding: 9pt 18pt; } .task-box { padding: 14pt 20pt; }
  .slide-content { padding-top: 10pt; padding-bottom: 10pt; }
</style>
</head>
<body>
<div class="slide-header">
  <span class="lesson-tag"><p>10–20 MIN · I DO</p></span>
  <span class="sep"></span>
  <span class="section-name"><p>句型 · 多少钱一……？</p></span>
  <span class="slide-num"><p>15 / 20</p></span>
  <div class="accent-line"></div>
</div>
<div class="slide-content">
  <p class="section-label">今天的句型</p>
  <div class="pattern-box" style="margin-top:10pt;">
    <p class="pattern-text">多少钱 一 + 量词 ？ &nbsp;→&nbsp; 价钱 + 一 + 量词 。</p>
  </div>
  <div class="sentence-list" style="margin-top:17pt;">
    <div class="sentence-row">
      <p class="sentence-cn">盒饭贵吗？多少钱一盒？ —— 十九块，不算太贵。</p>
    </div>
    <div class="sentence-row">
      <p class="sentence-cn">三明治多少钱一个？ —— 七块六。</p>
    </div>
    <div class="sentence-row">
      <p class="sentence-cn">薯条多少钱一份？ —— 五块五。</p>
    </div>
    <div class="sentence-row both">
      <p class="sentence-cn">咖喱牛肉饭比鱼柳饭便宜吗？ —— 不便宜，鱼柳饭十六块，咖喱牛肉饭十五块。</p>
      <p class="sentence-en">A price question answered with a comparison — this is the one to aim for.</p>
    </div>
  </div>
</div>
