  <p class="section-label">用今天六个词，一个都不能少 · 4 分钟</p>
  <h2 class="heading" style="margin-top:6pt;">给妈妈写一张便条 — Write Mum a note</h2>
  <div class="task-box" style="margin-top:13pt;">
    <p class="task-line">写 <b>四句话</b>：</p>
    <p class="task-cn" style="margin-top:7pt;">1. 你去哪里 —— 市场 / 菜市场</p>
    <p class="task-cn">2. 你买了什么肉 —— 猪肉、牛肉</p>
    <p class="task-cn">3. 那里的菜怎么样 —— 新鲜、便宜</p>
    <p class="task-cn">4. 你为什么去那里</p>
  </div>
  <div class="extension-box">
    <p class="extension-label">Extension · 加分题</p>
    <p class="extension-text">不看词汇板写。加上「<b>因为……所以……</b>」，再写一样你<b>没买</b>的东西和原因。</p>
