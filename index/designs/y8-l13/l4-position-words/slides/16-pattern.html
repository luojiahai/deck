<div class="slide-content">
  <p class="section-label">句型 · 六个方位词，一个用法</p>
  <div class="pattern-box"><p class="pattern-text">东西 + 在 + 地方 + 面</p></div>
  <div class="stack gap-md" style="margin-top:10pt;">
    <div class="sc-row"><p class="sc-num">1</p><div><p class="task-cn">电视<b>在</b>客厅里面。</p><p class="sc-main" style="margin-top:3pt;">The TV is in the living room.</p></div></div>
    <div class="sc-row"><p class="sc-num">2</p><div><p class="task-cn">客厅里面<b>有</b>电视。</p><p class="sc-main" style="margin-top:3pt;">In the living room there is a TV — same facts, other end.</p></div></div>
    <div class="sc-row"><p class="sc-num">3</p><div><p class="task-cn">我的书房<b>在</b>卧室右面。</p><p class="sc-main" style="margin-top:3pt;">My study is to the right of the bedroom.</p></div></div>
  </div>
  <p class="support" style="margin-top:10pt;">方位词不能省。✗ 我的书在桌子 —— 要说 <b>桌子上面</b>。</p>
</div>
