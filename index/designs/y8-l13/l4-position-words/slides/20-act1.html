    <p class="task-line"><b>先用真东西</b>　书放在椅子上、椅子下、书包里、门外面。每次问：<b>书在哪儿？</b> 全班一起答。</p>

    <p class="task-line"><b>再看课本 p.124 第 3 题</b>　那张乱七八糟的房间图，点名一人一句。</p>
    <p class="task-line">图上的家具只认不写：沙发 · 椅子 · 书架 · 杯子 · 牙刷 · 相框 · 咖啡桌。</p>
    <p class="task-cn" style="margin-top:10pt;">电视机在地上。　书在书架里面。　杯子在咖啡桌上面。</p>
