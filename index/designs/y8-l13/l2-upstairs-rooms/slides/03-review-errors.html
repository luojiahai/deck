<body>
<div class="slide-header">
  <span class="lesson-tag">0–8 MIN · REVIEW</span>
  <span class="sep"></span>
  <span class="section-name">复习 · 改错</span>
  <span class="slide-num">3 / 26</span>
  <div class="accent-line"></div>
</div>
<div class="slide-content">
  <p class="section-label">改错 · 三句都有问题 · 先写在小白板上，不要抢答</p>
  <div class="stack" style="gap:2pt;">
    <div class="err-row"><div class="err-wrong"><p>我的房间有楼上。</p></div><span class="err-arrow">&rsaquo;</span><div class="err-right"><p>我的房间在楼上。</p></div><p class="support" style="margin-left:6pt;">说在哪儿，用「在」</p></div>
    <div class="err-row"><div class="err-wrong"><p>我家的房子在两层。</p></div><span class="err-arrow">&rsaquo;</span><div class="err-right"><p>我家的房子有两层。</p></div><p class="support" style="margin-left:6pt;">说有什么，用「有」</p></div>
    <div class="err-row"><div class="err-wrong"><p>楼上有三个层。</p></div><span class="err-arrow">&rsaquo;</span><div class="err-right"><p>楼上有三层。</p></div><p class="support" style="margin-left:6pt;">「层」自己就是量词，不加「个」</p></div>
  </div>
  <p class="support" style="margin-top:10pt;">第三句是新的——「层」跟「个」不能一起用。今天还有一个量词要学。</p>
</div>
