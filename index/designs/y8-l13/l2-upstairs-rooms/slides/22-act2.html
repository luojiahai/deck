<body>

  <span class="section-name">活动二 · You Do · 9 分钟</span>

  <div class="accent-line"></div>
</div>
<div class="slide-content">
  <p class="section-label">活动二 · 两人一组 · 一个人说，一个人画</p>
  <div class="task-box">
    <p class="task-line">每人在第二张格子纸上设计楼上，先不要给同桌看。</p>
    <p class="task-line">中间隔一本书。A 说，B 画，画完对一对。</p>
    <p class="task-line">然后交换，再来一次。</p>
    <p class="task-cn" style="margin-top:10pt;">A：楼上有三间卧室。　B：（画）有书房吗？　A：有，书房在左边。</p>
  </div>
  <div class="extension-box">
    <p class="extension-label">Extension</p>
    <p class="extension-text">B 不可以问「有没有」这样的问题，只能问 <b>楼上有什么？</b> 和 <b>有几间？</b>——A 就必须自己说出完整的句子。交换以后，A 的房子里要有一个<b>不在楼上</b>的房间。最后两个人都用第三人称写三句：<b>他家的房子有两层，楼上有……</b></p>
  </div>
</div>
