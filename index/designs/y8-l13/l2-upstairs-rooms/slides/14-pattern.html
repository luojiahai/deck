<!DOCTYPE html>
<html lang="zh-CN"><head>
<meta charset="UTF-8">
<title>Y8 L13 · Pattern · 间 / 个</title>
<link rel="stylesheet" href="../../shared/tokens.css">
</head>
<body>
<div class="slide-header">
  <span class="lesson-tag">10–20 MIN · I DO</span>
  <span class="sep"></span>
  <span class="section-name">句型 · 量词</span>
  <span class="slide-num">14 / 26</span>
  <div class="accent-line"></div>
</div>
<div class="slide-content">
  <p class="section-label">量词 · 数房间用哪一个？</p>
  <div class="pattern-box"><p class="pattern-text">几 + 间 + 卧室　／　几 + 个 + 浴室</p></div>
  <div class="stack gap-md" style="margin-top:10pt;">
    <div class="sc-row"><p class="sc-num">1</p><div><p class="task-cn">楼上有三<b>间</b>卧室。</p><p class="sc-main" style="margin-top:3pt;">Bedrooms take 间.</p></div></div>
    <div class="sc-row"><p class="sc-num">2</p><div><p class="task-cn">楼下有一<b>间</b>卧室。</p><p class="sc-main" style="margin-top:3pt;">Still 间 — it is not about which floor.</p></div></div>
    <div class="sc-row"><p class="sc-num">3</p><div><p class="task-cn">我家有两<b>个</b>浴室。</p><p class="sc-main" style="margin-top:3pt;">Bathrooms take 个.</p></div></div>
  </div>
  <p class="support" style="margin-top:10pt;">不是看大小，也不是看楼上楼下。<b>卧室</b>用「间」，<b>浴室、书房、房间</b>用「个」。</p>
</div>
</body></html>
