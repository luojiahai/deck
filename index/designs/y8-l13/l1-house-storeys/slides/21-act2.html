    <div class="sc-row" style="padding:8pt 14pt;"><p class="sc-num" style="font-size:19pt;min-width:19pt;">1</p><div><p class="sc-main">我的房间 ____ 楼上。</p></div></div>

  </div>
  <p class="support" style="margin-top:8pt;">写完举起来。然后把屏幕关掉，自己写三句，至少一句用「有」、一句用「在」。</p>
