<!DOCTYPE html>
<html lang="zh-CN"><head>
<meta charset="UTF-8">
<title>Y8 L13 · 有 vs 在 — the contrast</title>
<link rel="stylesheet" href="../../shared/tokens.css">
</head>
<body>
<div class="slide-header">
  <span class="lesson-tag">10–20 MIN · I DO</span>
  <span class="sep"></span>
  <span class="section-name">句型 · 有 还是 在</span>
  <span class="slide-num">14 / 25</span>
  <div class="accent-line"></div>
</div>
<div class="slide-content">
  <p class="section-label">有 还是 在？ · which one?</p>
  <div class="contrast">
    <div class="contrast-col">
      <p class="contrast-key">有</p>
      <p class="contrast-gloss">there is / there are</p>
      <p class="contrast-form">place + 有 + thing</p>
      <p class="contrast-eg">楼上有三个房间。</p>
    </div>
    <div class="contrast-col alt">
      <p class="contrast-key">在</p>
      <p class="contrast-gloss">is located at</p>
      <p class="contrast-form">thing + 在 + place</p>
      <p class="contrast-eg">我的房间在楼上。</p>
    </div>
  </div>
  <p class="support" style="margin-top:12pt;">课本 p.124 的 NOTE 就是这两条。两边说的是同一件事，只是从哪一头开始说。</p>
</div>
