<div class="slide-content">
  <p class="section-label">活动一 · 画你家的房子（剖面图）</p>
  <div class="figure-wrap">
    <div class="fig"><img src="../../img/ceng.svg" alt=""></div>
    <div class="fig-body">
      <p class="task-line">先一起在黑板上画一个——两层，标 <b>楼上</b>、<b>楼下</b>。</p>
      <p class="task-line">每一层写有几个 <b>房间</b>，用箭头标出 <b>我的房间</b>。</p>
      <p class="task-line">图下面写三句：一句用 <b>有</b>，一句用 <b>在</b>，一句说有几个房间。</p>
      <p class="task-line">房子至少要有两 <b>层</b>。</p>
      <p class="task-cn" style="margin-top:10pt;">我家的房子有两层。楼上有三个房间。我的房间在楼上。</p>
    </div>
  </div>
