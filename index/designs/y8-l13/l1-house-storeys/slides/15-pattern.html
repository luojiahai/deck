  <p class="section-label">句型 · 说房子里有什么、在哪儿</p>

  <div class="stack gap-md" style="margin-top:10pt;">
    <div class="sc-row"><p class="sc-num">1</p><div><p class="task-cn">我家的房子<b>有</b>两层。</p><p class="sc-main" style="margin-top:3pt;">My house has two storeys — saying what exists.</p></div></div>
    <div class="sc-row"><p class="sc-num">2</p><div><p class="task-cn">我的房间<b>在</b>楼上。</p><p class="sc-main" style="margin-top:3pt;">My room is upstairs — saying where it is.</p></div></div>
    <div class="sc-row"><p class="sc-num">3</p><div><p class="task-cn">楼上<b>有</b>三个房间。</p><p class="sc-main" style="margin-top:3pt;">Upstairs there are three rooms — place first, then 有.</p></div></div>
