<div class="slide-content">
  <p class="section-label">游戏 · 一位同学抽一张地点卡，不给别人看</p>
  <div class="task-box">
    <p class="task-line">全班猜他要去哪儿，可是<b>只能问路线问题</b>——</p>
    <p class="task-line">　　你走路去吗？ 要坐几站？ 路上过桥吗？ 那个地方在市中心吗？</p>
    <p class="task-line"><b>不能问</b>「那是什么地方？」。最多二十个问题。</p>
    <p class="task-line">答的人只能说：对 · 不对 · 我不知道。</p>
  </div>
  <div class="extension-box">
    <p class="extension-label">Extension</p>
    <p class="extension-text">给流利的同学：不说「对／不对」，用<b>完整句</b>答——<b>不对，我不走路去，我坐公共汽车。</b> 信息更多，也逼他每次都要说话。</p>
  </div>
