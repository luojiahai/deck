<div class="slide-content">
  <p class="section-label">活动二 · 先采访，再报告</p>
  <div class="stack" class="gap-md">
    <div class="sc-row"><p class="sc-num">1</p><div><p class="sc-main">采访 · 六个问题，答案记在格子里，不写整句</p><p class="sc-cn">6 分钟</p></div></div>
    <div class="sc-row"><p class="sc-num">2</p><div><p class="sc-main">流利的同学<b>先当采访者</b>——让同伴先听见问题长什么样</p></div></div>
    <div class="sc-row"><p class="sc-num">3</p><div><p class="sc-main">报告 · 白板上写<b>两句</b>，用第三人称，然后点六七位念出来</p><p class="sc-cn">4 分钟</p></div></div>
    <div class="sc-row"><p class="sc-num">4</p><div><p class="sc-main">全班听：谁把「他／她」说成了「我」？</p><p class="sc-cn">这是今天要抓的错</p></div></div>
  </div>
  <p class="support" style="margin-top:10pt;">报告同伴，同时用「比」跟自己比：<b>他家比我家离学校近。我要坐车，可是他走路十分钟就到了。</b>再加一句「我觉得……」。做完就去采访第二个人，说说谁的路更省事。</p>
</div>
