<div class="slide-content">
  <p class="section-label">游戏 · 两人一组，卡片扣着 · A 是警察，B 报案</p>
  <div class="task-box">
    <p class="task-line">A 按卡片上的四个问题问：在哪儿被偷的？包里有什么？钱包里有什么？姓名和电话？</p>
    <p class="task-line">B <b>用自己活动一写的那张纸条</b>回答。</p>
    <p class="task-line">做完换卡片，用同伴的纸条再演一次。</p>
  </div>
  <div class="extension-box">
    <p class="extension-label">Extension</p>
    <p class="extension-text">给流利的同学：警察那张卡是<b>空白</b>的——问题自己编，至少问六个，其中一个要是书上没有的：<b>什么时候被偷的？当时旁边有人吗？你去问过商店了吗？</b>报案的人<b>不看纸条</b>回答。</p>
  </div>
</div>
