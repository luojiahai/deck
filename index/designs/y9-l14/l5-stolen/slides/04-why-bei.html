<div class="slide-content">
  <p class="section-label">为什么中文要有「被」</p>
  <div class="frame-box">
    <p class="frame-line" style="font-size:24pt;line-height:1.55;">中文平常先说「谁做的」。可是有的时候，你<b>不知道</b>是谁做的，或者你<b>不在乎</b>——你只在乎东西没有了。这时候用「被」。</p>
  </div>
  <p class="body-lg" style="margin-top:12pt;">Chinese normally leads with who did it. 被 is for when you don't know, or don't care — you only care what happened to the thing.</p>
  <p class="support" style="margin-top:10pt;">先讲这一句，再讲语法。不然「被」就只是一个要背的字。</p>
</div>
