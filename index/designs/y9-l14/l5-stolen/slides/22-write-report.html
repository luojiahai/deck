<div class="slide-content">
  <p class="section-label">在纸条上写你<b>自己</b>的报案 · 四句话 · 五个生词都要用上</p>
  <div class="task-box">
    <p class="task-line">换一个地方，换一包东西——别抄小青的。</p>
    <p class="task-line">这张纸条<b>等一下要交给警察</b>（活动三的同伴），所以要让别人看得懂。</p>
    <p class="task-line">三个问题必须答得出来：在哪儿被偷的？包里有什么？钱包里有什么？</p>
  </div>
  <div class="extension-box">
    <p class="extension-label">Extension</p>
    <p class="extension-text">换个角度写——用<b>警察</b>的口气记录，第三人称：<b>小青说她的手提包在四彩服装店被偷了，包里有……</b>最后加一句：警察<b>忘了问</b>的那个问题是什么？</p>
  </div>
</div>
