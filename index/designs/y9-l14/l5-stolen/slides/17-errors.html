<!DOCTYPE html>
<html lang="zh-CN"><head>
<meta charset="UTF-8">
<title>Y9 L14 · 被字句 · 三种错法</title>
<link rel="stylesheet" href="../../shared/tokens.css">
</head>
<body>
<div class="slide-header">
  <span class="lesson-tag">10–20 MIN · I DO</span>
  <span class="sep"></span>
  <span class="section-name">注意 · The three that break</span>
  <span class="slide-num">17 / 26</span>
  <div class="accent-line"></div>
</div>
<div class="slide-content">
  <p class="section-label">被字句 · 常见的三种错</p>
  <div class="stack" style="gap:2pt;">
    <div class="err-row"><div class="err-wrong"><p>我的钱包偷了被。</p></div><span class="err-arrow">›</span><div class="err-right"><p>我的钱包被偷了。</p></div><p class="support" style="margin-left:6pt;">「被」在动词<b>前</b></p></div>
    <div class="err-row"><div class="err-wrong"><p>被弟弟蛋糕吃完了。</p></div><span class="err-arrow">›</span><div class="err-right"><p>蛋糕被弟弟吃完了。</p></div><p class="support" style="margin-left:6pt;">东西要放最前面</p></div>
    <div class="err-row"><div class="err-wrong"><p>我的自行车被哥哥骑。</p></div><span class="err-arrow">›</span><div class="err-right"><p>我的自行车被哥哥骑走了。</p></div><p class="support" style="margin-left:6pt;">动词后面要有「了」或者结果</p></div>
  </div>
  <p class="support" style="margin-top:10pt;">第三种最常见——写的时候句子看起来「说完了」，其实还差一个字。</p>
</div>
</body></html>
