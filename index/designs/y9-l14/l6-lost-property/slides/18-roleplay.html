  <div class="task-box">
    <p class="task-line"><b>丢了手机 · 丢了钱包 · 丢了书包</b></p>
    <p class="task-line">A 在服务台，要<b>按顺序</b>问清楚五件事：</p>
    <p class="task-line">　你丢了什么？ 什么时候丢的？ 在哪儿丢的？ 里边有什么？ 请留下姓名和电话。</p>

  </div>
  <div class="extension-box">
    <p class="extension-label">Extension</p>
    <p class="extension-text">给流利的同学：服务台说东西<b>已经有人送来了</b>——可是要先确认是不是他的，得问他里边有什么才给看：<b>你说说包里有什么，我看看对不对。</b>认领的人<b>不看表格</b>凭记忆说。两边对不上，服务台就不给。</p>
