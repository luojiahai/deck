<!DOCTYPE html>
<html lang="zh-CN"><head>
<meta charset="UTF-8">
<title>Y9 L14 · 没有找到 · 还是 · 找不到？</title>
<link rel="stylesheet" href="../../shared/tokens.css">
</head>
<body>
<div class="slide-header">
  <span class="lesson-tag">10–20 MIN · I DO</span>
  <span class="sep"></span>
  <span class="section-name">注意 · 否定最容易错</span>
  <span class="slide-num">12 / 19</span>
  <div class="accent-line"></div>
</div>
<div class="slide-content">
  <p class="section-label">否定 · 没有找到 / 找不到</p>
  <div class="stack" style="gap:2pt;">
    <div class="err-row"><div class="err-wrong"><p>我找我的钱包到了。</p></div><span class="err-arrow">›</span><div class="err-right"><p>我找到我的钱包了。</p></div><p class="support" style="margin-left:6pt;">结果紧跟动词，中间不插东西</p></div>
    <div class="err-row"><div class="err-wrong"><p>我不找到。</p></div><span class="err-arrow">›</span><div class="err-right"><p>我没有找到。</p></div><p class="support" style="margin-left:6pt;">已经发生的事，用「没有」</p></div>
    <div class="err-row"><div class="err-wrong"><p>我没有找到。</p></div><span class="err-arrow">›</span><div class="err-right"><p>我找不到。</p></div><p class="support" style="margin-left:6pt;">两句都对，意思不一样：找过了没找着 ／ 现在<b>怎么也</b>找不着</p></div>
  </div>
  <p class="support" style="margin-top:10pt;">第三行不是改错——是两个都对。测验的翻译题两种都考。</p>
</div>
</body></html>
