<div class="slide-content">
  <p class="section-label">句型 · 做了，还是做成了？</p>
  <div class="pattern-box"><p class="pattern-text" style="font-size:24pt;">动词 + 结果（+ 了）· 找到 · 吃完 · 借走 · 听见</p></div>
  <div class="stack gap-md" style="margin-top:10pt;">
    <div class="sc-row"><p class="sc-num">1</p><div><p class="task-cn">我<b>找到</b>我的手机了。</p><p class="sc-main" style="margin-top:3pt;">I found my phone. (and I have it)</p></div></div>
    <div class="sc-row"><p class="sc-num">2</p><div><p class="task-cn">我的自行车被哥哥<b>骑走</b>了。</p><p class="sc-main" style="margin-top:3pt;">My bike was ridden off by my brother.</p></div></div>
    <div class="sc-row"><p class="sc-num">3</p><div><p class="task-cn">钱都<b>花完</b>了。</p><p class="sc-main" style="margin-top:3pt;">The money's all spent.</p></div></div>
  </div>
  <p class="support" style="margin-top:10pt;">「我找了」＝ 我找了很久，可是不知道找着没有。「我找<b>到</b>了」＝ 东西在我手里。</p>
