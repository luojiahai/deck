  <p class="section-label">活动一 · 我的一天，怎么去？ · 三次出门，三种走法，<b>六个生词都要用上</b></p>
  <div class="task-box">
    <p class="task-line">三到四句话。写完，同伴数一数你漏了哪个词。</p>
    <p class="task-line">样子：</p>
    <p class="task-cn" style="margin-top:10pt;">早上我骑自行车去学校。下午我跟朋友去购物广场，车站就在广场旁边，我们坐25路车回家。</p>
  </div>
  <div class="extension-box">
    <p class="extension-label">Extension</p>
    <p class="extension-text">不看屏幕写，而且每句都要用连词连起来——<b>先……然后……</b>、<b>因为……所以……</b>、<b>……的时候</b>。最后加一句：哪一趟最花时间？为什么？</p>
