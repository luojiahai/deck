<!DOCTYPE html>
<html lang="zh-CN"><head>
<meta charset="UTF-8">
<title>Y9 L14 · 或者 or 还是？</title>
<link rel="stylesheet" href="../../shared/tokens.css">
</head>
<body>
<div class="slide-header">
  <span class="lesson-tag">10–20 MIN · I DO</span>
  <span class="sep"></span>
  <span class="section-name">注意 · The one to get right</span>
  <span class="slide-num">16 / 22</span>
  <div class="accent-line"></div>
</div>
<div class="slide-content">
  <p class="section-label">或者 ≠ 还是</p>
  <div class="stack" style="gap:2pt;">
    <div class="err-row"><div class="err-wrong"><p>你还是骑自行车去，还是坐车去。</p></div><span class="err-arrow">›</span><div class="err-right"><p>你或者骑自行车去，或者坐车去。</p></div><p class="support" style="margin-left:6pt;">陈述句 · 用「或者」</p></div>
    <div class="err-row"><div class="err-wrong"><p>我或者骑自行车，或者坐车？</p></div><span class="err-arrow">›</span><div class="err-right"><p>你骑自行车还是坐车？</p></div><p class="support" style="margin-left:6pt;">问句 · 用「还是」</p></div>
  </div>
  <p class="support" style="margin-top:10pt;">「或者」说的是答案，「还是」问的是问题。今天一整节课都会有人写错这个。</p>
</div>
</body></html>
