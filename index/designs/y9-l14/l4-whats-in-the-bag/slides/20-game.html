<body>
<div class="slide-header">
  <span class="lesson-tag">20–43 MIN · FLEXIBLE PRACTICE</span>
  <span class="sep"></span>
  <span class="section-name">游戏 · 9 分钟</span>
  <span class="slide-num">20 / 21</span>
  <div class="accent-line"></div>
</div>
<div class="slide-content">
  <p class="section-label">游戏 · 两段</p>
  <div class="task-box">
    <p class="task-line"><b>第一段（4 分钟）· 记忆袋</b> —— 真袋子倒出八样东西，看三十秒，盖上。白板上写下你记得的，写<b>汉字</b>，一个一分。</p>
    <p class="task-line"><b>第二段（5 分钟）· 两真一假</b> —— 四人一组，每人说三句自己包里的东西，两句真一句假。</p>
    <p class="task-line">　　我的包里有两把钥匙。 我的钱包里有五十块现金。 我有两个手机。</p>
    <p class="task-line">组里投票哪句是假的。骗过组里一分，猜中一分。</p>
  </div>
  <div class="extension-box">
    <p class="extension-label">Extension</p>
    <p class="extension-text">给流利的同学：三句话要用<b>三种不同的说法</b>——一句带量词和数字，一句用「除了……以外」，一句用「可是」。投票前组里还可以用中文追问一个问题。</p>
  </div>
</div>
