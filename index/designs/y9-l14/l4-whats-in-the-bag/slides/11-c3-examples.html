<body>
<div class="slide-header">
  <span class="lesson-tag">10–20 MIN · I DO</span>
  <span class="sep"></span>
  <span class="section-name">例句 3 · See them used</span>
  <span class="slide-num">11 / 21</span>
  <div class="accent-line"></div>
</div>
<div class="slide-content">
  <p class="section-label">例句 · See them used</p>
  <div class="sentence-list">
    <div class="sentence-row">
      <p class="sentence-cn">我有一百块<b>现金</b>。</p>
      <p class="sentence-en">I've got a hundred yuan in cash.</p>
    </div>
    <div class="sentence-row">
      <p class="sentence-cn">我妈妈在<b>服装</b>店工作。</p>
      <p class="sentence-en">My mum works in a clothes shop.</p>
    </div>
    <div class="sentence-row both">
      <p class="sentence-cn">我在<b>服装</b>店买衣服，付了两百块<b>现金</b>。</p>
      <p class="sentence-en">I bought clothes at the clothes shop and paid 200 in cash.</p>
    </div>
  </div>
  <p class="support" style="margin-top:10pt;">问：「现金」的「金」是金子。「钱」的左边也是金字旁——钱的字都带金属。</p>
</div>
