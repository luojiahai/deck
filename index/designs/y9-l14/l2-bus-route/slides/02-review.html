<div class="slide-content">
  <p class="section-label">两人一组，九十秒，白板上找出来改过来。然后本子上写两句：改错 · 三句里有两句是坏的</p>
  <div class="stack" style="gap:2pt;">
    <div class="err-row"><div class="err-wrong"><p>我还是骑自行车去，还是坐公共汽车去。</p></div><span class="err-arrow">›</span><div class="err-right"><p>我或者骑自行车去，或者坐公共汽车去。</p></div><p class="support" style="margin-left:6pt;">陈述句用「或者」</p></div>
    <div class="err-row"><div class="err-wrong"><p>我坐公共汽车25路上学。</p></div><span class="err-arrow">›</span><div class="err-right"><p>我坐25路公共汽车上学。</p></div><p class="support" style="margin-left:6pt;">「几路」在「公共汽车」<b>前面</b></p></div>
    <div class="err-row"><div class="err-wrong"><p>车站就在教堂对面。</p></div><span class="err-arrow">›</span><div class="err-right"><p>车站就在教堂对面。</p></div><p class="support" style="margin-left:6pt;">这句没错——别都改</p></div>
  </div>
  <p class="support" style="margin-top:10pt;">一句用「或者」说你怎么上学，一句说你家附近的车站在哪儿。</p>
</div>
