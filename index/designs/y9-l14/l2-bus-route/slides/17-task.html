<div class="slide-content">
  <p class="section-label">活动一 · 画路线，写路线 · 从「我家」到「购物广场」</p>
  <div class="task-box">
    <p class="task-line">路上<b>一定要经过</b>：一座庙 · 一条河 · 一座大桥 · 一个车站。</p>
    <p class="task-line">先在地图纸上画，再在本子上写四到六句。屏幕上每个词都要出现。</p>
    <p class="task-line">念的时候，请第三位同学拿笔在黑板地图上跟着走。走错地方——就说明路线写得不够清楚。</p>
  </div>
  <div class="extension-box">
    <p class="extension-label">Extension</p>
    <p class="extension-text">同一条路写<b>两遍</b>：一遍给走路的人（用上节课的 路口／拐／红绿灯），一遍给坐车的人（用 几路／几站／下车）。最后一句用「比」说哪个快，为什么。</p>
  </div>
</div>
