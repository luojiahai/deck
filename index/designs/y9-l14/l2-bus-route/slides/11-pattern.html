<div class="slide-content">
  <p class="section-label">句型 · 坐车，要问三件事</p>
  <div class="pattern-box"><p class="pattern-text">坐几路车？ → 要坐几站？ → 在哪站下车？</p></div>
  <div class="stack gap-md" style="margin-top:10pt;">
    <div class="sc-row"><p class="sc-num">1</p><div><p class="task-cn">坐几路公共汽车？</p><p class="sc-main" style="margin-top:3pt;">坐25路或97路都可以。</p></div></div>
    <div class="sc-row"><p class="sc-num">2</p><div><p class="task-cn">要坐几站？</p><p class="sc-main" style="margin-top:3pt;">大概坐五六站。</p></div></div>
    <div class="sc-row"><p class="sc-num">3</p><div><p class="task-cn">在哪站下车？</p><p class="sc-main" style="margin-top:3pt;">在购物广场那站下车。</p></div></div>
  </div>
  <p class="support" style="margin-top:10pt;">「五六站」——两个数字并排放，意思是「大概五个或六个」。「三四个」「十几分钟」一样。</p>
</div>
