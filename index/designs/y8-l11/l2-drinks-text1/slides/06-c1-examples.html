<div class="slide-header">

<div class="slide-content">
  <p class="section-label">例句 · See them used</p>
  <div class="sentence-list">
    <div class="sentence-row">
      <p class="sentence-py">Wǒ xǐhuan hē shuǐ.</p>
      <p class="sentence-cn">我喜欢<b>喝</b>水。</p>
      <p class="sentence-en">I like drinking water.</p>
    </div>
    <div class="sentence-row">
      <p class="sentence-py">Wǒ bù xǐhuan hē zhèxiē yǐnliào.</p>
      <p class="sentence-cn">我不喜欢<b>喝</b>这些<b>饮料</b>。</p>
      <p class="sentence-en">I don't like drinking these beverages.</p>
    </div>
    <div class="sentence-row both">
      <p class="sentence-py">Nǐ xǐhuan hē shénme yǐnliào?</p>
      <p class="sentence-cn">你喜欢<b>喝</b>什么<b>饮料</b>？</p>
      <p class="sentence-en">What drinks do you like? — today's question.</p>
    </div>
  </div>
