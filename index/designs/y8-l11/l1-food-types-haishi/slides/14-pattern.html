<!DOCTYPE html>
<html lang="zh-CN"><head>
<meta charset="UTF-8">
<title>Y8 L11 · I Do · 句型 A 还是 B？</title>
<link rel="stylesheet" href="../../shared/tokens.css">
</head>
<body>
<div class="slide-header">
  <span class="lesson-tag">10–20 MIN · I DO</span>
  <span class="sep"></span>
  <span class="section-name">句型 · Sentence pattern</span>
  <span class="slide-num">14 / 20</span>
  <div class="accent-line"></div>
</div>
<div class="slide-content">
  <div class="pattern-box"><p class="pattern-text">A <b>还是</b> B？</p><p class="pattern-note">háishi · "or" — in a <b>question</b> only. The answer never contains 还是.</p></div>
  <div style="margin-top:22px">  <p class="section-label">模仿我说 · Watch me build it</p>
  <div class="example-list">
    <div class="example-row">
      <p class="example-num">1</p>
      <div><p class="example-cn">你喜欢吃中餐<b>还是</b>西餐？ — 我喜欢吃中餐。</p></div>
    </div>
    <div class="example-row">
      <p class="example-num">2</p>
      <div><p class="example-cn">你想吃热狗<b>还是</b>汉堡包？ — 我想吃汉堡包。</p></div>
    </div>
    <div class="example-row">
      <p class="example-num">3</p>
      <div><p class="example-cn">我们去打球<b>还是</b>看电影？ — 我们去看电影。</p></div>
    </div>
    <div class="example-row hardest">
      <p class="example-num">4</p>
      <div><p class="example-cn">你想跟爸爸去吃快餐<b>还是</b>跟妈妈去吃中餐？</p><p class="example-en">Two full clauses, one either side.</p></div>
    </div>
  </div></div>
</div>
</body></html>
