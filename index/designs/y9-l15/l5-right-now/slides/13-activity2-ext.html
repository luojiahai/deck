  <p class="section-label">活动二 · Extension · 不要写七张，写<b>三张</b>——但写成一段话</p>
  <div class="task-box">
    <p class="task-line">一个邻居，三件事都是他做的。六句以上：</p>
    <p class="task-line">他<b>平时</b>做什么 · 他<b>正在</b>做什么 · 你<b>特别喜欢</b>还是<b>非常不喜欢</b>，为什么。</p>
    <p class="task-line">「因为……所以……」用两次，「虽然……但是……」用一次。连词表翻过去。</p>
    <p class="task-cn" style="margin-top:10pt;">我楼上的邻居平时很安静，可是他今天正在开派对呢。</p>
