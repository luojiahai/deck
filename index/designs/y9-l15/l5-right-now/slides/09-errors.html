<!DOCTYPE html>
<html lang="zh-CN"><head>
<meta charset="UTF-8">
<title>Y9 L15 · 正在……呢 常见的错</title>
<link rel="stylesheet" href="../../shared/tokens.css">
</head>
<body>
<div class="slide-header">
  <span class="lesson-tag">10–20 MIN · I DO</span>
  <span class="sep"></span>
  <span class="section-name">注意 · The one to get right</span>
  <span class="slide-num">9 / 16</span>
  <div class="accent-line"></div>
</div>
<div class="slide-content">
  <p class="section-label">正在 在前，呢 在后</p>
  <div class="stack" style="gap:2pt;">
    <div class="err-row"><div class="err-wrong"><p>他正在呢跳舞。</p></div><span class="err-arrow">›</span><div class="err-right"><p>他正在跳舞呢。</p></div><p class="support" style="margin-left:6pt;">「呢」在<b>最后</b></p></div>
    <div class="err-row"><div class="err-wrong"><p>他正在每天看电视呢。</p></div><span class="err-arrow">›</span><div class="err-right"><p>他每天看电视。</p></div><p class="support" style="margin-left:6pt;">「每天」是习惯，不能配「正在」</p></div>
    <div class="err-row"><div class="err-wrong"><p>我说谢谢，他说对不起。</p></div><span class="err-arrow">›</span><div class="err-right"><p>我说谢谢，他说不用客气。</p></div><p class="support" style="margin-left:6pt;">回「谢谢」要用「不用客气」</p></div>
  </div>
  <p class="support" style="margin-top:10pt;">第二个不是小错——「正在」和「每天」放在一起，意思就打架了。</p>
</div>
</body></html>
