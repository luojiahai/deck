  <p class="section-label">活动一 · 课本 p.149 第 9 题 · 十一张图 · 两人一张，各写各的本子</p>
  <div class="task-box">
    <p class="task-line"><b>先写四分钟</b> · 一张图一句「正在……呢」，能写几张写几张。</p>
    <p class="task-line"><b>再说三分钟</b> · 同伴随便指一张，你<b>不看本子</b>回答。</p>
    <p class="task-line">最后请两位同学，当场回答三张随机的图。</p>
  </div>
  <div class="extension-box">
    <p class="extension-label">Extension</p>
    <p class="extension-text">把十一张写成<b>一整段</b>——晚上十一点，从一楼扫到顶楼：<b>一楼的邻居正在……呢，二楼的……</b>。其中三句要说这个声音<b>传不传得到你那儿</b>（我听见……／我没听见……）。最后一句：最吵的那一个，你打算怎么办？用「把」或者「能不能」。</p>
