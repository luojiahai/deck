<!DOCTYPE html>
<html lang="zh-CN"><head>
<meta charset="UTF-8">
<title>Y9 L15 · 时间词放哪儿？</title>
<link rel="stylesheet" href="../../shared/tokens.css">
</head>
<body>
<div class="slide-header">
  <span class="lesson-tag">10–20 MIN · I DO</span>
  <span class="sep"></span>
  <span class="section-name">注意 · The one to get right</span>
  <span class="slide-num">13 / 21</span>
  <div class="accent-line"></div>
</div>
<div class="slide-content">
  <p class="section-label">最近 在前，不在后</p>
  <div class="stack" style="gap:2pt;">
    <div class="err-row"><div class="err-wrong"><p>我搬家最近了。</p></div><span class="err-arrow">›</span><div class="err-right"><p>我最近搬家了。</p></div><p class="support" style="margin-left:6pt;">时间词在动词<b>前面</b></p></div>
    <div class="err-row"><div class="err-wrong"><p>我烦人楼上的邻居。</p></div><span class="err-arrow">›</span><div class="err-right"><p>楼上的邻居很烦人。</p></div><p class="support" style="margin-left:6pt;">「烦人」是形容词，不是动词</p></div>
  </div>
  <p class="support" style="margin-top:10pt;">中文的时间词永远走在动词前面。这一节课会有人写反——先说在前面。</p>
</div>
</body></html>
