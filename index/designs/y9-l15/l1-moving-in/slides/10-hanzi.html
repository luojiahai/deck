</head>
<body>
<div class="slide-header">
  <span class="lesson-tag">10–20 MIN · I DO</span>
  <span class="sep"></span>
  <span class="section-name">看字 · How the words are built</span>
  <span class="slide-num">10 / 21</span>
  <div class="accent-line"></div>
</div>
<div class="slide-content">
  <p class="section-label">看字 · 两个词，各两个字——分开看就懂了</p>
  <div class="stack" class="gap-md">
    <div class="sc-row"><p class="sc-num">1</p><div><p class="sc-main">邻 · 旁边的 · 居 · 住</p><p class="sc-cn">住在我们旁边的人 —— 就是「邻居」</p></div></div>
    <div class="sc-row"><p class="sc-num">2</p><div><p class="sc-main">烦 · 让人不舒服 · 人</p><p class="sc-cn">让人不舒服的 —— 就是「烦人」</p></div></div>
    <div class="sc-row"><p class="sc-num">3</p><div><p class="sc-main">搬 · 把东西移走 · 家</p><p class="sc-cn">把整个家移走 —— 就是「搬家」</p></div></div>
    <div class="sc-row"><p class="sc-num">4</p><div><p class="sc-main">「搬」不一定跟「家」</p><p class="sc-cn">搬桌子、搬椅子都可以说「搬」</p></div></div>
  </div>
  <p class="support" style="margin-top:10pt;">「烦人」说的是<b>吵你的那个人</b>，不是<b>被吵的你</b>。</p>
</div>
