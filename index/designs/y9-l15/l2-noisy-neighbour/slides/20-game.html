<body>
<div class="slide-header">
  <span class="lesson-tag">20–43 MIN · FLEXIBLE PRACTICE</span>
  <span class="sep"></span>
  <span class="section-name">游戏 · 8 分钟</span>
  <span class="slide-num">20 / 21</span>
  <div class="accent-line"></div>
</div>
<div class="slide-content">
  <p class="section-label">游戏 · Bingo · 自己画一个三乘三的格子，自己填</p>
  <div class="task-box">
    <p class="task-line">词库（十二个选九个，<b>要写汉字，不写拼音</b>）：</p>
    <p class="task-line">听见 响 半夜 哭 跑步 电视机 狗叫 鸟叫 跳舞 踢球 看电影 邻居</p>
    <p class="task-line">老师<b>不说单词</b>——老师说一整句，句子里有哪个词，就划掉哪个。</p>
    <p class="task-line">例：<b>每天半夜，楼上的小孩子哭得很响。</b> 三个连成一线就喊「中了」。</p>
  </div>
  <div class="extension-box">
    <p class="extension-label">Extension</p>
    <p class="extension-text">喊「中了」以后，要先把那三个词读出来，再用<b>三个词一起</b>说一句话，才算数。说不出来，游戏继续，下一线再试。</p>
  </div>
</div>
