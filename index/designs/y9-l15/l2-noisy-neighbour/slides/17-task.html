<div class="slide-content">
  <p class="section-label">活动一 · 半夜的那栋楼 · 屏幕上五个亮着的窗户 · 本子上写，五分钟</p>
  <div class="task-box">
    <p class="task-line">写<b>四句话</b>，说你在楼下听见了什么。</p>
    <p class="task-line">规矩很紧：<b>每一句都要用「听见」</b>，四句里<b>四个生词都要用上</b>，<b>至少两句要用「得」</b>。</p>
    <p class="task-line">写完跟同伴换本子，专门查对方的「得」。老师请两位读出来。</p>
  </div>
  <div class="extension-box">
    <p class="extension-label">Extension</p>
    <p class="extension-text">写成<b>一段话</b>，不是四个句子——你是住在一楼睡不着的那个人。五句以上，用<b>可是／因为……所以……／一……就……</b>连起来，三个「得」要配<b>三个不一样的形容词</b>（响、快、好）。最后一句：明天你打算怎么办？不看总览板。</p>
  </div>
