<!DOCTYPE html>
<html lang="zh-CN"><head>
<meta charset="UTF-8">
<title>Y9 L15 · 得 不是 的</title>
<link rel="stylesheet" href="../../shared/tokens.css">
</head>
<body>
<div class="slide-header">
  <span class="lesson-tag">10–20 MIN · I DO</span>
  <span class="sep"></span>
  <span class="section-name">注意 · The one to get right</span>
  <span class="slide-num">13 / 21</span>
  <div class="accent-line"></div>
</div>
<div class="slide-content">
  <p class="section-label">得 / 的 —— 说出来一样，写出来不一样</p>
  <div class="stack" style="gap:2pt;">
    <div class="err-row"><div class="err-wrong"><p>他跑的很快。</p></div><span class="err-arrow">›</span><div class="err-right"><p>他跑得很快。</p></div><p class="support" style="margin-left:6pt;">动词后面用<b>得</b>，不是「的」</p></div>
    <div class="err-row"><div class="err-wrong"><p>他很快跑得。</p></div><span class="err-arrow">›</span><div class="err-right"><p>他跑得很快。</p></div><p class="support" style="margin-left:6pt;">顺序：动词 → 得 → 形容词</p></div>
    <div class="err-row"><div class="err-wrong"><p>电视机响开。</p></div><span class="err-arrow">›</span><div class="err-right"><p>电视机开得很响。</p></div><p class="support" style="margin-left:6pt;">「响」不能当动词用</p></div>
  </div>
  <p class="support" style="margin-top:10pt;">这一课全班最容易错的就是这个。老师走动的时候，专门看这一个字。</p>
</div>
</body></html>
