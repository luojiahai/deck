<title>Y9 L15 · Pattern · V + 得 + 形容词</title>
<link rel="stylesheet" href="../../shared/tokens.css">
</head>
<body>
<div class="slide-header">
  <span class="lesson-tag">10–20 MIN · I DO</span>
  <span class="sep"></span>
  <span class="section-name">句型 · Sentence pattern</span>
  <span class="slide-num">11 / 21</span>
  <div class="accent-line"></div>
</div>
<div class="slide-content">
  <p class="section-label">句型 · 事情做得怎么样</p>
  <div class="pattern-box"><p class="pattern-text">动词 + 得 + 很 + 形容词</p></div>
  <div class="stack gap-md" style="margin-top:10pt;">
    <div class="sc-row"><p class="sc-num">1</p><div><p class="task-cn">他跑<b>得</b>很快。</p><p class="sc-main" style="margin-top:3pt;">He runs fast.</p></div></div>
    <div class="sc-row"><p class="sc-num">2</p><div><p class="task-cn">小孩子哭<b>得</b>很响。</p><p class="sc-main" style="margin-top:3pt;">The child is crying loudly.</p></div></div>
    <div class="sc-row"><p class="sc-num">3</p><div><p class="task-cn">楼上的邻居半夜跑步跑<b>得</b>很响。</p><p class="sc-main" style="margin-top:3pt;">The neighbours upstairs run so loudly at midnight.</p></div></div>
  </div>
  <p class="support" style="margin-top:10pt;">有宾语的时候，动词要再说一遍：<b>跑步跑得很响</b>、<b>开电视机开得很响</b>。</p>
</div>
</body></html>
