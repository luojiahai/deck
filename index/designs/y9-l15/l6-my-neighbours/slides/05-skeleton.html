<div class="slide-content">
  <p class="section-label">示范 · 跟全班一起在黑板上写一段 · 顺序比词更重要</p>
  <div class="stack" class="gap-md">
    <div class="sc-row"><p class="sc-num">1</p><div><p class="sc-main">① 谁</p><p class="sc-cn">我家隔壁住着一家人。／我们楼上是一对老夫妻。</p></div></div>
    <div class="sc-row"><p class="sc-num">2</p><div><p class="sc-main">② 几口人，哪国人</p><p class="sc-cn">他们家有四口人，是从中国来的。</p></div></div>
    <div class="sc-row"><p class="sc-num">3</p><div><p class="sc-main">③ 平时做什么</p><p class="sc-cn">他们平时很忙，周末常常在花园里种花。</p></div></div>
    <div class="sc-row"><p class="sc-num">4</p><div><p class="sc-main">④ 我觉得</p><p class="sc-cn">我觉得他们很好，可是他们的狗很吵，半夜常常把我吵醒。</p></div></div>
  </div>
  <p class="support" style="margin-top:10pt;">第 ④ 步是「把」「被」「得」该出现的地方——一段九年级的话，就是靠这一步从「一句一句」变成「一段」。</p>
