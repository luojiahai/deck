  <p class="section-label">句型 · 今天不学新的，今天把学过的放进一段话里</p>
  <div class="pattern-box"><p class="pattern-text" style="font-size:24pt;">住着 / 楼上是…… · 如果……，我会…… · 把 · 被 · 得</p></div>
  <div class="stack gap-md" style="margin-top:10pt;">
    <div class="sc-row"><p class="sc-num">1</p><div><p class="task-cn">三零一<b>住着</b>一家人，三零二<b>是</b>一对老夫妻。</p><p class="sc-main" style="margin-top:3pt;">Who is where.</p></div></div>
    <div class="sc-row"><p class="sc-num">2</p><div><p class="task-cn"><b>如果</b>楼上太吵，我<b>会</b>去敲门，请他们小点儿声。</p><p class="sc-main" style="margin-top:3pt;">What you'd do about it.</p></div></div>
    <div class="sc-row"><p class="sc-num">3</p><div><p class="task-cn">他们的狗<b>把</b>我吵醒了，可是他们的电视开<b>得</b>不响。</p><p class="sc-main" style="margin-top:3pt;">把 and 得 in one sentence.</p></div></div>
  </div>
  <p class="support" style="margin-top:10pt;">「被」今天也要出现一次——想一想：你家有什么东西<b>被</b>邻居借走过？</p>
