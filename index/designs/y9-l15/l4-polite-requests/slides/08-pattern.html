  <p class="section-label">句型 · 有礼貌地请别人改一改</p>
  <div class="pattern-box"><p class="pattern-text">能不能 + 动词 + 一点儿／小点儿声？</p></div>
  <div class="stack gap-md" style="margin-top:10pt;">
    <div class="sc-row"><p class="sc-num">1</p><div><p class="task-cn">请说慢<b>一点儿</b>。</p><p class="sc-main" style="margin-top:3pt;">Please speak more slowly.</p></div></div>
    <div class="sc-row"><p class="sc-num">2</p><div><p class="task-cn"><b>能不能</b>小点儿声？</p><p class="sc-main" style="margin-top:3pt;">Could you keep it down?</p></div></div>
    <div class="sc-row"><p class="sc-num">3</p><div><p class="task-cn"><b>能不能</b>把电视机开得小<b>一点儿</b>？</p><p class="sc-main" style="margin-top:3pt;">Could you turn the television down?</p></div></div>
  </div>
  <p class="support" style="margin-top:10pt;">「能不能」本身已经是问句了——后面<b>不要</b>再加「吗」。</p>
