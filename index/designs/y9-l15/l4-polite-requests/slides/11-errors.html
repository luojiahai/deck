<!DOCTYPE html>
<html lang="zh-CN"><head>
<meta charset="UTF-8">
<title>Y9 L15 · 能不能……？ 常见的错</title>
<link rel="stylesheet" href="../../shared/tokens.css">
</head>
<body>
<div class="slide-header">
  <span class="lesson-tag">10–20 MIN · I DO</span>
  <span class="sep"></span>
  <span class="section-name">注意 · The one to get right</span>
  <span class="slide-num">11 / 20</span>
  <div class="accent-line"></div>
</div>
<div class="slide-content">
  <p class="section-label">能不能 ≠ 能不能……吗</p>
  <div class="stack" style="gap:2pt;">
    <div class="err-row"><div class="err-wrong"><p>能不能小点儿声吗？</p></div><span class="err-arrow">›</span><div class="err-right"><p>能不能小点儿声？</p></div><p class="support" style="margin-left:6pt;">已经是问句，不要「吗」</p></div>
    <div class="err-row"><div class="err-wrong"><p>请你一点儿快说。</p></div><span class="err-arrow">›</span><div class="err-right"><p>请你说快一点儿。</p></div><p class="support" style="margin-left:6pt;">「一点儿」在形容词后面</p></div>
    <div class="err-row"><div class="err-wrong"><p>你小声！</p></div><span class="err-arrow">›</span><div class="err-right"><p>能不能小点儿声？</p></div><p class="support" style="margin-left:6pt;">这不是错句，是不礼貌——今天要练礼貌的说法</p></div>
  </div>
  <p class="support" style="margin-top:10pt;">第三个不是语法错。同一个意思，说法不一样，结果完全不一样。</p>
</div>
</body></html>
