<!DOCTYPE html>
<html lang="zh-CN"><head>
<meta charset="UTF-8">
<title>Y9 L15 · Pattern · 动词 + 得 + 形容词 + 一点儿</title>
<link rel="stylesheet" href="../../shared/tokens.css">
</head>
<body>
<div class="slide-header">
  <span class="lesson-tag">10–20 MIN · I DO</span>
  <span class="sep"></span>
  <span class="section-name">句型 · 从「很」到「一点儿」</span>
  <span class="slide-num">9 / 20</span>
  <div class="accent-line"></div>
</div>
<div class="slide-content">
  <p class="section-label">句型 · 不是说它多响，是要它<b>改</b></p>
  <div class="pattern-box"><p class="pattern-text">动词 + 得 + 形容词 + 一点儿</p></div>
  <div class="stack gap-md" style="margin-top:10pt;">
    <div class="sc-row"><p class="sc-num">1</p><div><p class="task-cn">电视机开得很<b>响</b>。</p><p class="sc-main" style="margin-top:3pt;">It's on loud. (saying how it is)</p></div></div>
    <div class="sc-row"><p class="sc-num">2</p><div><p class="task-cn">请把电视机开得小<b>一点儿</b>。</p><p class="sc-main" style="margin-top:3pt;">Turn it down a bit. (asking it to change)</p></div></div>
    <div class="sc-row"><p class="sc-num">3</p><div><p class="task-cn">你跑得快<b>一点儿</b>！</p><p class="sc-main" style="margin-top:3pt;">Run a bit faster!</p></div></div>
  </div>
  <p class="support" style="margin-top:10pt;">「一点儿」放在形容词<b>后面</b>：快一点儿，不是「一点儿快」。</p>
</div>
</body></html>
