<body>
<div class="slide-header">
  <span class="lesson-tag">10–20 MIN · I DO</span>
  <span class="sep"></span>
  <span class="section-name">看字 · How the words are built</span>
  <span class="slide-num">10 / 22</span>
  <div class="accent-line"></div>
</div>
<div class="slide-content">
  <p class="section-label">看字 · 四个字，两两分开</p>
  <div class="stack" class="gap-md">
    <div class="sc-row"><p class="sc-num">1</p><div><p class="sc-main">吵 · 左边是「口」</p><p class="sc-cn">从嘴里出来的——所以又是「吵闹」，又是「吵架」</p></div></div>
    <div class="sc-row"><p class="sc-num">2</p><div><p class="sc-main">吵醒 · 吵 + 醒</p><p class="sc-cn">用吵的方式把人弄醒。当成<b>一整块</b>记</p></div></div>
    <div class="sc-row"><p class="sc-num">3</p><div><p class="sc-main">声 · 声音本身（名词）</p><p class="sc-cn">电视机的<b>声音</b>很响</p></div></div>
    <div class="sc-row"><p class="sc-num">4</p><div><p class="sc-main">响 · 声音有多大（形容词）</p><p class="sc-cn">不能说「我响电视机」</p></div></div>
  </div>
  <p class="support" style="margin-top:10pt;">「声」和「响」是这一课最容易混的一对——一个是<b>什么</b>，一个是<b>多大</b>。</p>
</div>
