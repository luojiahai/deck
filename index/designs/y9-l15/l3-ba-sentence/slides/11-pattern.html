<div class="slide-content">
  <p class="section-label">句型 · 「把」字句 · 课本 p.148 NOTE</p>
  <div class="pattern-box"><p class="pattern-text">谁 + 把 + 什么 + 动词 + 了／补语</p></div>
  <div class="stack gap-md" style="margin-top:10pt;">
    <div class="sc-row"><p class="sc-num">1</p><div><p class="task-cn">弟弟<b>把</b>牛奶喝了。</p><p class="sc-main" style="margin-top:3pt;">My little brother drank the milk.</p></div></div>
    <div class="sc-row"><p class="sc-num">2</p><div><p class="task-cn">请<b>把</b>你的电话号码留下。</p><p class="sc-main" style="margin-top:3pt;">Please leave your phone number.</p></div></div>
    <div class="sc-row"><p class="sc-num">3</p><div><p class="task-cn">弟弟的哭声<b>把</b>我吵醒了。</p><p class="sc-main" style="margin-top:3pt;">My brother's crying woke me up.</p></div></div>
  </div>
  <p class="support" style="margin-top:10pt;">动词后面<b>一定</b>还有东西——了、走、上、醒、下。「我把手机借」不是一句话。</p>
</div>
