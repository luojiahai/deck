<!DOCTYPE html>
<html lang="zh-CN"><head>
<meta charset="UTF-8">
<title>Y9 L15 · 把 字句常见的错</title>
<link rel="stylesheet" href="../../shared/tokens.css">
</head>
<body>
<div class="slide-header">
  <span class="lesson-tag">10–20 MIN · I DO</span>
  <span class="sep"></span>
  <span class="section-name">注意 · The one to get right</span>
  <span class="slide-num">14 / 22</span>
  <div class="accent-line"></div>
</div>
<div class="slide-content">
  <p class="section-label">把 ≠ 被</p>
  <div class="stack" style="gap:2pt;">
    <div class="err-row"><div class="err-wrong"><p>我把吵醒了你。</p></div><span class="err-arrow">›</span><div class="err-right"><p>你把我吵醒了。</p></div><p class="support" style="margin-left:6pt;">「把」后面放<b>东西／人</b>，不是动词</p></div>
    <div class="err-row"><div class="err-wrong"><p>我把手机借。</p></div><span class="err-arrow">›</span><div class="err-right"><p>我把手机借走了。</p></div><p class="support" style="margin-left:6pt;">动词后面要有<b>结果</b></p></div>
    <div class="err-row"><div class="err-wrong"><p>我的自行车把哥哥骑走了。</p></div><span class="err-arrow">›</span><div class="err-right"><p>我的自行车被哥哥骑走了。</p></div><p class="support" style="margin-left:6pt;">自行车不会骑人——这里要用「被」</p></div>
  </div>
  <p class="support" style="margin-top:10pt;">第三个是整个单元最容易错的一句，考试也考。</p>
</div>
</body></html>
