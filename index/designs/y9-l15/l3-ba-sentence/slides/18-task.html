<body>
<div class="slide-header">
  <span class="lesson-tag">20–43 MIN · FLEXIBLE PRACTICE</span>

  <span class="section-name">活动一 · We Do · 7 分钟</span>
  <span class="slide-num">18 / 22</span>
  <div class="accent-line"></div>
</div>
<div class="slide-content">
  <p class="section-label">活动一 · 上一课那五个声音，现在写成「把」字句 · 两人一组，白板，五分钟</p>
  <div class="task-box">
    <p class="task-line">屏幕上五句普通句子：<b>楼上的小孩子半夜哭。</b> ……</p>
    <p class="task-line">每一句改成「把」字句，结尾是<b>吵醒了</b>。</p>
    <p class="task-line">五句里，今天的四个词都要出现。样子：</p>
    <p class="task-cn" style="margin-top:10pt;">楼上小孩子的哭声把我吵醒了。</p>
  </div>
  <div class="extension-box">
    <p class="extension-label">Extension</p>
    <p class="extension-text">五句各写<b>两遍</b>——一遍「把」，一遍「被」。再写第六句：有一个声音<b>没有人投诉</b>，用「因为……，所以……」说清楚为什么那个没关系。不看屏幕，「被」那一句的「了」不能丢。</p>
  </div>
</div>
