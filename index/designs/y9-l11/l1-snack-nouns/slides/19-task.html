    <p class="task-line"><b>第八家是你们学校的小卖部</b> —— 那一句要用到总览板上<b>每一个</b>词。</p>
    <p class="task-cn" style="margin-top:10pt;">例：这家超市卖各种各样的零食，比如巧克力、糖果等。</p>
  </div>
  <div class="extension-box">
    <p class="extension-label">Extension</p>
    <p class="extension-text">三句，不看总览板。第一句用「各种各样……比如」，第二句用「比」比较两种零食的价钱，第三句用「因为……，所以……」说你为什么常买那一种。写完念给同桌，同桌要问你一个问题。</p>
