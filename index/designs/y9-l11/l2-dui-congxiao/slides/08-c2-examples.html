<div class="slide-content">
  <p class="section-label">例句 · See them used</p>
  <div class="sentence-list">
    <div class="sentence-row">
      <p class="sentence-cn">我<b>从小</b>就喜欢吃巧克力。</p>
      <p class="sentence-en">I've liked chocolate since I was small.</p>
    </div>
    <div class="sentence-row">
      <p class="sentence-cn">我妈妈<b>总是</b>买各种各样的零食。</p>
      <p class="sentence-en">My mum is always buying all kinds of snacks.</p>
    </div>
    <div class="sentence-row both">
      <p class="sentence-cn">我<b>从小</b>就喜欢吃冰淇淋，妈妈<b>总是</b>买给我。</p>
      <p class="sentence-en">I've liked ice cream since I was small, and mum always buys it for me.</p>
    </div>
  </div>
  <p class="support" style="margin-top:10pt;">问：「总是」和「常常」，哪一个多？</p>
