    <p class="frame-line" style="font-size:25pt;line-height:1.55;">我知道糖果和汽水<b>对牙齿不好</b>，可是我<b>从小就</b>喜欢吃零食。妈妈<b>总是</b>对我说，不要吃太多零食，应该多吃<b>正餐</b>。</p>

    <p class="task-line"><b>用中文回答</b> · 1 他知道糖果对什么不好？ · 2 妈妈总是对他说什么？ · 3 他听妈妈的话吗？为什么你这样想？</p>
    <p class="task-line" style="margin-top:6pt;">顺便记住妈妈的两个词：<b>不要</b> + 动词（don't）· <b>应该</b> + 动词（should）。下节课写翻译的时候要用。</p>
