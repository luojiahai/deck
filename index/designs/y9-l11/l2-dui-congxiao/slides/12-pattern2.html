  <div class="frame-box">
    <p class="frame-line" style="font-size:27pt;line-height:1.55;">我知道糖果和汽水<b>对牙齿不好</b>，可是我<b>从小就</b>喜欢吃零食。</p>

  <p class="body-lg" style="margin-top:12pt;">I know sweets and soft drinks are bad for my teeth, but I've liked snacks since I was small.</p>
  <p class="support" style="margin-top:10pt;">「可是」把两半连起来：前面说你知道什么，后面说你还是这样做。</p>
  <div class="extension-box">
    <p class="extension-label">Extension</p>
    <p class="extension-text">照这个样子说你自己一件事 —— 我知道……对……不好，可是我从小就…… 不写，直接说。</p>
