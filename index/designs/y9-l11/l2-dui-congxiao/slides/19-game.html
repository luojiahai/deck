  <span class="section-name">游戏 · 改错 · 4 分钟</span>
  <span class="slide-num">19 / 20</span>
  <div class="accent-line"></div>
</div>
<div class="slide-content">
  <p class="section-label">改错 · 黑板上五句，三句是错的 —— 找出来，在白板上写对的</p>
  <div class="stack" style="gap:2pt;">
    <div class="err-row"><div class="err-wrong"><p>我从小喜欢吃巧克力。</p></div><span class="err-arrow">›</span><div class="err-right"><p>我从小<b>就</b>喜欢……</p></div><p class="support" style="margin-left:6pt;">「从小就」是固定说法</p></div>
    <div class="err-row"><div class="err-wrong"><p>我对音乐非常感兴趣的。</p></div><span class="err-arrow">›</span><div class="err-right"><p>我对音乐非常感兴趣。</p></div><p class="support" style="margin-left:6pt;">多了一个「的」</p></div>
    <div class="err-row"><div class="err-wrong"><p>吃太多零食对牙齿比不好。</p></div><span class="err-arrow">›</span><div class="err-right"><p>吃太多零食对牙齿不好。</p></div><p class="support" style="margin-left:6pt;">这里不用「比」</p></div>
  </div>
  <p class="support" style="margin-top:10pt;">另外两句是对的：<b>汽水对牙齿很不好。</b> · <b>妈妈总是对我说，应该多吃正餐。</b> 进阶：让说得好的同学自己出一对句子，还要说出错在哪里。</p>
</div>
