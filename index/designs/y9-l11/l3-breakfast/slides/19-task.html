<!DOCTYPE html>
<html lang="zh-CN"><head>
<meta charset="UTF-8">
<title>Y9 L11 · We Do · 任务 三天的早饭表</title>
<link rel="stylesheet" href="../../shared/tokens.css">
</head>
<body>
<div class="slide-header">
  <span class="lesson-tag">20–43 MIN · FLEXIBLE PRACTICE</span>
  <span class="sep"></span>
  <span class="section-name">任务 · 三天早饭表</span>
  <span class="slide-num">19 / 23</span>
  <div class="accent-line"></div>
</div>
<div class="slide-content">
  <p class="section-label">We Do · 一个人写 · 4 分钟</p>
  <div class="task-box">
    <p class="task-line">写<b>星期一、星期二、星期三</b>三天的早饭。</p>
    <p class="task-line">三天加起来要用到总览板上<b>每一个</b>词，而且至少有一天要用「加」。</p>
    <p class="task-line">写完用一句话说哪一天的早饭最好，为什么。</p>
    <p class="task-cn" style="margin-top:10pt;">星期一：谷类早餐加牛奶。 星期二：面包、煎蛋和香肠。 星期三：……</p>
  </div>
  <div class="extension-box">
    <p class="extension-label">Extension</p>
    <p class="extension-text">不写表，写<b>一段话</b>。四到六句，三天都说到，每句都要连起来（用「星期一……，星期二……，可是星期三……」）。最后一句用「因为……，所以……」说哪一天的早饭对身体最好。<b>不看总览板。</b></p>
  </div>
</div>
</body></html>
