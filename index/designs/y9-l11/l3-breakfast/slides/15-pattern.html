  <p class="section-label">句型 · A 加 B —— 把两样东西放在一起</p>
  <div class="pattern-box"><p class="pattern-text">A 加 B</p></div>
  <div class="stack gap-md" style="margin-top:10pt;">
    <div class="sc-row"><p class="sc-num">1</p><div><p class="task-cn">谷类早餐加牛奶</p><p class="sc-main" style="margin-top:3pt;">cereal with milk</p></div></div>
    <div class="sc-row"><p class="sc-num">2</p><div><p class="task-cn">茶里加牛奶和糖</p><p class="sc-main" style="margin-top:3pt;">tea with milk and sugar</p></div></div>
    <div class="sc-row"><p class="sc-num">3</p><div><p class="task-cn">我早饭吃谷类早餐加牛奶。</p><p class="sc-main" style="margin-top:3pt;">For breakfast I have cereal with milk.</p></div></div>
  </div>
  <p class="support" style="margin-top:10pt;">「加」不是「和」。「和」是两样并排，「加」是一样<b>放进</b>另一样里。</p>
