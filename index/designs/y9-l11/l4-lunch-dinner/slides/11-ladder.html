<div class="slide-content">
  <p class="section-label">从最多到最少 · 今天的新词是第五格：<b>有时</b> yǒushí <i>sometimes</i>（课本写「有时＝有时候」）</p>
  <div class="ladder">
    <div class="rung">总是</div>
    <span class="arrow">&rsaquo;</span>
    <div class="rung">每天</div>
    <span class="arrow">&rsaquo;</span>
    <div class="rung">常常／经常</div>
    <span class="arrow">&rsaquo;</span>
    <div class="rung">一般／平时／通常</div>
    <span class="arrow">&rsaquo;</span>
    <div class="rung new">有时／有时候</div>
    <span class="arrow">&rsaquo;</span>
    <div class="rung">很少</div>
  </div>
  <div class="task-box" style="margin-top:16pt;"><p class="task-cn">我午饭<b>一般</b>吃三明治，<b>有时</b>吃薯条。</p></div>
  <p class="support" style="margin-top:10pt;">红框是新的，其他五个第十课都学过了。「有时」只是「有时候」的短说法，意思完全一样 —— 课本两个都用。</p>
