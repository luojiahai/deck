<!DOCTYPE html>
<html lang="zh-CN"><head>
<meta charset="UTF-8">
<title>Y9 L11 · Cycle 1 · C — 写一句</title>
<link rel="stylesheet" href="../../shared/tokens.css">
</head>
<body>
<div class="slide-header">
  <span class="lesson-tag">10–20 MIN · I DO</span>
  <span class="sep"></span>
  <span class="section-name">写一句 1 · Write your own</span>
  <span class="slide-num">7 / 16</span>
  <div class="accent-line"></div>
</div>
<div class="slide-content">
  <p class="section-label">写一句 · Write one sentence · 60–90 秒</p>
  <div class="frame-box">
    <p class="frame-line">我常常帮 ________ 。</p>
    <p class="frame-line">我 ________ 完了。</p>
  </div>
  <div class="extension-box">
    <p class="extension-label">Extension</p>
    <p class="extension-text">写三句：一句说你在家帮谁做什么，一句说你上个周末做完了什么，一句用「因为……，所以……」说你为什么帮忙（或者为什么不帮忙）。三句要连起来。</p>
  </div>
  <p class="support" style="margin-top:10pt;">注意：<b>帮忙</b> 后面不能再放人。「帮<b>忙</b>妈妈」是错的 —— 说谁的时候把「忙」拿掉：<b>帮妈妈</b>。</p>
</div>
</body></html>
