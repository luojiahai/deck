<body>
<div class="slide-header">
  <span class="lesson-tag">10–20 MIN · I DO</span>
  <span class="sep"></span>
  <span class="section-name">句型 · 难句 · 用两次</span>
  <span class="slide-num">10 / 16</span>
  <div class="accent-line"></div>
</div>
<div class="slide-content">
  <p class="section-label">最难的一句 · 一句话里用两次 · 「才」是第二册的</p>
  <div class="frame-box">
    <p class="frame-line" style="font-size:27pt;line-height:1.55;">我吃<b>完</b>晚饭<b>以后帮</b>妈妈洗碗，洗<b>完</b>碗<b>以后</b>才做作业。</p>
  </div>
  <p class="body-lg" style="margin-top:12pt;">After I finish dinner I help mum wash up, and only after the washing-up is done do I start my homework.</p>
  <p class="support" style="margin-top:10pt;">两次「完……以后」，一件事接一件事。「才」是「一直到那时候才」—— 有点晚的意思。</p>
  <div class="extension-box">
    <p class="extension-label">Extension</p>
    <p class="extension-text">照这个样子说你自己的晚上，从放学说到睡觉，至少用两次「完……以后」。不写，直接说。</p>
  </div>
</div>
</body></html>
