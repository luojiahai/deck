<div class="slide-content">
  <p class="section-label">例句 · See them used</p>
  <div class="sentence-list">
    <div class="sentence-row">
      <p class="sentence-cn">我常常<b>帮</b>妈妈洗碗。</p>
      <p class="sentence-en">I often help my mum wash up.</p>
    </div>
    <div class="sentence-row">
      <p class="sentence-cn">我做<b>完</b>作业了。</p>
      <p class="sentence-en">I've finished my homework.</p>
    </div>
    <div class="sentence-row both">
      <p class="sentence-cn">我吃<b>完</b>晚饭以后，会<b>帮</b>妈妈洗碗。</p>
      <p class="sentence-en">After I finish dinner I help my mum wash up.</p>
    </div>
  </div>
  <p class="support" style="margin-top:10pt;">问：「你会帮忙吗？」和「你会帮妈妈吗？」——两个都对吗？</p>
