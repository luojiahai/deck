  <p class="section-label">游戏 · 句子拼图 · 六组卡片，六张桌子，拼完换桌</p>
  <div class="task-box">
    <p class="task-line">这是课本练习册 p.145 第 4 题——也是<b>单元测验第四部分</b>的题型。</p>
    <p class="task-line">两组用书上的原题：</p>
    <p class="task-line">　· 住 / 我家 / 市中心 / 在 / 。</p>
    <p class="task-line">　· 很远 / 邮局 / 市政大楼 / 离 / 。</p>
    <p class="task-line">其余四组用今天的词自己编。</p>
    <p class="task-cn" style="margin-top:10pt;">「市政大楼」下节课才学——让他们从「市」和「大楼」猜。</p>
  </div>
  <div class="extension-box">
    <p class="extension-label">Extension</p>
    <p class="extension-text">两个信封里是<b>两句连起来</b>的长句（我家离市中心不远，走路十分钟就到了），而且<b>多一张用不上的卡片</b>——要说出是哪一张、为什么。</p>
