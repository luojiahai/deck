</head>
<body>
<div class="slide-header">
  <span class="lesson-tag">10–20 MIN · I DO</span>
  <span class="sep"></span>
  <span class="section-name">句型 · Sentence pattern</span>
  <span class="slide-num">11 / 18</span>
  <div class="accent-line"></div>
</div>
<div class="slide-content">
  <p class="section-label">句型 · 说距离</p>
  <div class="pattern-box"><p class="pattern-text">A + 离 + B + 很近／不远／很远</p></div>
  <div class="stack gap-md" style="margin-top:10pt;">
    <div class="sc-row"><p class="sc-num">1</p><div><p class="task-cn">我家离学校很近。</p><p class="sc-main" style="margin-top:3pt;">My home is very close to school.</p></div></div>
    <div class="sc-row"><p class="sc-num">2</p><div><p class="task-cn">邮局离我家不远。</p><p class="sc-main" style="margin-top:3pt;">The post office is not far from my home.</p></div></div>
    <div class="sc-row"><p class="sc-num">3</p><div><p class="task-cn">我家离市中心很远，坐车三十分钟。</p><p class="sc-main" style="margin-top:3pt;">My home is far from the city centre — thirty minutes by car.</p></div></div>
  </div>
  <p class="support" style="margin-top:10pt;">顺序：<b>要量的地方</b>在前，<b>起点</b>在后。不是「离我家邮局不远」。</p>
</div>
