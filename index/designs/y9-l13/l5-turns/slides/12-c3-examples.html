<div class="slide-content">
  <p class="section-label">例句 · See them used</p>
  <div class="sentence-list">
    <div class="sentence-row">
      <p class="sentence-cn">这是<b>第</b>一个路口。</p>
      <p class="sentence-en">This is the first intersection.</p>
    </div>
    <div class="sentence-row">
      <p class="sentence-cn">在<b>第</b>二个路口过马路。</p>
      <p class="sentence-en">Cross the road at the second intersection.</p>
    </div>
    <div class="sentence-row both">
      <p class="sentence-cn">你在<b>第</b>一个路口往右拐，走五分钟就到了。</p>
      <p class="sentence-en">Turn right at the first intersection and it's five minutes.</p>
    </div>
  </div>
  <p class="support" style="margin-top:10pt;">问：「第」自己不是一个词——它把数字变成第几。<b>量词还要留着</b>：第一<b>个</b>路口。</p>
</div>
