</head>
<body>
<div class="slide-header">
  <span class="lesson-tag">10–20 MIN · I DO</span>
  <span class="sep"></span>
  <span class="section-name">句型 · 连成一段</span>
  <span class="slide-num">11 / 19</span>
  <div class="accent-line"></div>
</div>
<div class="slide-content">
  <p class="section-label">句型 · 一段话是怎么连起来的</p>
  <div class="pattern-box"><p class="pattern-text">先说「我家」→ 每一句挂在上一句提过的地方上</p></div>
  <div class="stack gap-md" style="margin-top:10pt;">
    <div class="sc-row"><p class="sc-num">1</p><div><p class="task-cn">我家住在市中心，生活很方便。</p><p class="sc-main" style="margin-top:3pt;">Opens with the speaker.</p></div></div>
    <div class="sc-row"><p class="sc-num">2</p><div><p class="task-cn">邮局离我家不远。</p><p class="sc-main" style="margin-top:3pt;">Hangs off 我家.</p></div></div>
    <div class="sc-row"><p class="sc-num">3</p><div><p class="task-cn">超级市场就在邮局对面。</p><p class="sc-main" style="margin-top:3pt;">Hangs off 邮局.</p></div></div>
  </div>
  <p class="support" style="margin-top:10pt;">这不是一张清单——是一条<b>链子</b>。每一句都抓住前一句里的地方。</p>
</div>
</body></html>
