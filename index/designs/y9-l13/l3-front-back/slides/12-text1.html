    <p class="frame-line" style="font-size:24pt;line-height:1.6;">我家住在市中心，生活很方便。邮局离我家不远。超级市场就在邮局对面。邮局的左边是诊所，右边是银行。市政大楼在百货公司的前面。我家附近还有一个大教堂。教堂的后面是一个小学，旁边是一个公园。</p>
