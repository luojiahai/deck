<div class="slide-header">
  <span class="lesson-tag">10–20 MIN · I DO</span>

  <span class="slide-num">5 / 21</span>

</div>
<div class="slide-content">
  <p class="section-label">例句 · See them used</p>
  <div class="sentence-list">
    <div class="sentence-row">
      <p class="sentence-cn">你<b>看到</b>红绿灯就过马路。</p>
      <p class="sentence-en">When you see the lights, cross the road.</p>
    </div>
    <div class="sentence-row">
      <p class="sentence-cn">银行就在你的<b>右手</b>边。</p>
      <p class="sentence-en">The bank is on your right-hand side.</p>
    </div>
    <div class="sentence-row both">
      <p class="sentence-cn">一直往前走，<b>看到</b>教堂，公园就在你的<b>右手</b>边。</p>
      <p class="sentence-en">Go straight; at the church, the park is on your right.</p>
    </div>
  </div>
  <p class="support" style="margin-top:10pt;">问：「看」和「看到」有什么不一样？</p>
</div>
