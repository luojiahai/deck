<div class="slide-content">
  <p class="section-label">活动一 · 全班建一座城 · 黑板上已经画好空白街道网（四横四竖）</p>
  <div class="task-box">
    <p class="task-line">每组拿一张 A4 卡，从上面的总览板里<b>挑一座建筑</b>，画出来，用汉字标上名字。</p>
    <p class="task-line">一组一组上来，把卡贴在网格上任何位置——<b>贴的代价</b>是用中文说一句话，把它摆好：</p>
    <p class="task-line">　<b>我们的银行在第二个路口，就在邮局对面。</b></p>
    <p class="task-line">最后黑板上是一座十二到十五座建筑的共享城市，而且每个学生都出声说过一句摆位句。</p>
  </div>
  <div class="extension-box">
    <p class="extension-label">Extension</p>
    <p class="extension-text">不贴自己的卡。听<b>前一组</b>的摆位句，按他们说的把<b>他们的</b>卡贴上去。贴错了，他们可以用中文纠正你。</p>
  </div>
