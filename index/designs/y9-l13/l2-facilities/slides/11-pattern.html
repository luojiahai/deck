<div class="slide-content">
  <p class="section-label">句型 A · 从自己出发</p>
  <div class="pattern-box"><p class="pattern-text">A + 就在 + B + 对面／旁边／附近</p></div>
  <div class="stack gap-md" style="margin-top:10pt;">
    <div class="sc-row"><p class="sc-num">1</p><div><p class="task-cn">银行就在邮局对面。</p><p class="sc-main" style="margin-top:3pt;">The bank is right opposite the post office.</p></div></div>
    <div class="sc-row"><p class="sc-num">2</p><div><p class="task-cn">诊所就在我家附近。</p><p class="sc-main" style="margin-top:3pt;">The clinic is right near my home.</p></div></div>
    <div class="sc-row"><p class="sc-num">3</p><div><p class="task-cn">百货公司就在银行旁边。</p><p class="sc-main" style="margin-top:3pt;">The department store is right beside the bank.</p></div></div>
  </div>
  <p class="support" style="margin-top:10pt;">「就」＝正好、就是那儿。去掉也对，加上才像本地人说的。</p>
