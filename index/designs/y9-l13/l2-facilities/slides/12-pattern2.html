  <p class="section-label">句型 B · 从地标出发</p>
  <div class="pattern-box"><p class="pattern-text">A + 的左边／右边 + 是 + B</p></div>
  <div class="stack gap-md" style="margin-top:10pt;">
    <div class="sc-row"><p class="sc-num">1</p><div><p class="task-cn">邮局的左边是诊所。</p><p class="sc-main" style="margin-top:3pt;">On the post office's left is the clinic.</p></div></div>
    <div class="sc-row"><p class="sc-num">2</p><div><p class="task-cn">邮局的右边是银行。</p><p class="sc-main" style="margin-top:3pt;">On the post office's right is the bank.</p></div></div>
    <div class="sc-row"><p class="sc-num">3</p><div><p class="task-cn">邮局的左边是诊所，右边是银行。</p><p class="sc-main" style="margin-top:3pt;">On its left is the clinic, on its right the bank.</p></div></div>
  </div>
  <p class="support" style="margin-top:10pt;">句型 A 从<b>要找的地方</b>说起，句型 B 从<b>地标</b>说起。两种都要会。</p>
