<div class="slide-content">
  <p class="section-label">活动二 · 写一写自助餐的甜品那一半</p>
  <div class="task-box">
    <p class="task-line">一个人写，写在练习本上，至少四句。</p>
    <p class="task-line">五个生词<b>都要用上</b>：烤了什么、甜品有什么（甜品、奶酪）、主食是什么（牛排）、大家吃得怎么样（饱）。</p>
    <p class="task-cn" style="margin-top:10pt;">上个周末我们一家去吃自助餐了。主食有烤牛排……甜品有奶酪蛋糕……我们都吃得很饱。</p>
  </div>
  <div class="extension-box">
    <p class="extension-label">Extension</p>
    <p class="extension-text">写别人，不写自己——用第三人称，再加上钱：<b>他们一家四口一共花了……块。</b> 然后评一句：挺便宜的 还是 挺贵的？用「因为……所以……」说为什么。<b>不看总览页。</b></p>
  </div>
