<body>
<div class="slide-header">
  <span class="lesson-tag">10–20 MIN · I DO</span>

  <span class="section-name">句型 · Sentence pattern</span>
  <span class="slide-num">15 / 23</span>

</div>
<div class="slide-content">
  <p class="section-label">句型 · 说做得怎么样</p>
  <div class="pattern-box"><p class="pattern-text">动词 + 得 + 很／非常 + 形容词</p></div>
  <div class="stack gap-md" style="margin-top:10pt;">
    <div class="sc-row"><p class="sc-num">1</p><div><p class="task-cn">我们都吃得很饱。</p><p class="sc-main" style="margin-top:3pt;">We all ate until we were full.</p></div></div>
    <div class="sc-row"><p class="sc-num">2</p><div><p class="task-cn">他吃得很快。</p><p class="sc-main" style="margin-top:3pt;">He eats fast.</p></div></div>
    <div class="sc-row"><p class="sc-num">3</p><div><p class="task-cn">他们的烤牛排做得非常好吃。</p><p class="sc-main" style="margin-top:3pt;">They make the roast beefsteak really well.</p></div></div>
  </div>
  <p class="support" style="margin-top:10pt;">「得」把动词和<b>做得怎么样</b>连起来。不是 ✗我很饱吃。</p>
</div>
