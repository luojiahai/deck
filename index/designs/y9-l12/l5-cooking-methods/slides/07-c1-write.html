  <p class="section-label">写一句 · Write one sentence · 60–90 秒</p>
  <div class="frame-box">
    <p class="frame-line">我喜欢吃红烧 ________ ，也喜欢吃蒸 ________ 。</p>

  <div class="extension-box">
    <p class="extension-label">Extension</p>
    <p class="extension-text">烤、红烧、蒸、炒——四种做法。用「比」写一句比较两种（我觉得蒸鱼比红烧鱼好吃），再用「因为」说为什么。</p>
