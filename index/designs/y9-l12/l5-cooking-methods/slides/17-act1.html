<div class="slide-content">
  <p class="section-label">活动一 · 每张图说两句 · 课本 p.116 第 8 题</p>
  <div class="task-box">
    <p class="task-line">两人一组，十四张图卡背面朝上洗好。</p>
    <p class="task-line">轮流翻一张，说<b>两句</b>——照范例。</p>
    <p class="task-line">十四张全部翻完才能停。</p>
    <p class="task-cn" style="margin-top:10pt;">范例：我非常喜欢吃龙虾。我每个月吃一次龙虾。</p>
  </div>
  <div class="extension-box">
    <p class="extension-label">Extension</p>
    <p class="extension-text">每张说<b>三句</b>，第三句要把这张和上一张连起来（蒸鱼比烤鸭清淡，所以我妈妈更喜欢蒸鱼）。翻完以后，挑四样配成一桌菜，说出来为什么这样配。</p>
  </div>
</div>
