<div class="slide-content">
  <p class="section-label">活动二 · 写你自己的自助餐菜单</p>
  <div class="task-box">
    <p class="task-line">一个人写，写在练习本上。</p>
    <p class="task-line">菜单要有 <b>主食</b> 和 <b>甜品</b> 两部分。</p>
    <p class="task-line">今天的四个生词都要用上，每样后面写价钱（用「块」）。</p>
    <p class="task-line">最后写一句：在我的自助餐厅你可以吃到……</p>
  </div>
  <div class="extension-box">
    <p class="extension-label">Extension</p>
    <p class="extension-text">写成一段话，不要写成单子——五六句连起来。加上一家三口一共要花多少钱（我们一家三口一共要花……块），再用「因为……所以……」说最贵的菜为什么这么贵。</p>
  </div>
