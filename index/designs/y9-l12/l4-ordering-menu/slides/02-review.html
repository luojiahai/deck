<div class="slide-content">
  <p class="section-label">找错、改对 · 白板 · 改完以后用中文说为什么</p>
  <div class="stack" style="gap:2pt;">
    <div class="err-row"><div class="err-wrong"><p>以后我吃完饭看电视。</p></div><span class="err-arrow">›</span><div class="err-right"><p>我吃完饭以后看电视。</p></div><p class="support" style="margin-left:6pt;">「以后」要放在分句后面</p></div>
    <div class="err-row"><div class="err-wrong"><p>我们都很饱吃。</p></div><span class="err-arrow">›</span><div class="err-right"><p>我们都吃得很饱。</p></div><p class="support" style="margin-left:6pt;">「得」连动词和结果</p></div>
    <div class="err-row"><div class="err-wrong"><p>这家饭店挺贵。</p></div><span class="err-arrow">›</span><div class="err-right"><p>这家饭店挺贵的。</p></div><p class="support" style="margin-left:6pt;">「挺……的」要有「的」</p></div>
  </div>
  <p class="support" style="margin-top:10pt;">第二句是对的：<b>我们一共花了三百多块。</b> 看谁没上当。</p>
