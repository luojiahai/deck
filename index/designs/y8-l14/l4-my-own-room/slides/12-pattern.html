  <div class="stack gap-md" style="margin-top:10pt;">

    <div class="sc-row"><p class="sc-num">3</p><div><p class="task-cn">我的床<b>在</b>房间<b>里面</b>，书桌<b>在</b>床<b>的</b>左面。</p><p class="sc-main" style="margin-top:3pt;">With a possessor in front, 的 goes in: 床的左面.</p></div></div>
  </div>
