      <p class="task-line"><b>把</b> 是给椅子用的量词。</p>
      <p class="task-line">它还能用在刀、伞上面——除此之外你几乎用不到它。</p>
      <p class="task-line">所以不要单独记「把」：跟「椅子」一起记，一辈子都不会分开。</p>
      <p class="task-line">反过来说，说「椅子」的时候忘了「把」，考试就在这里扣分。</p>
      <p class="task-cn" style="margin-top:10pt;">我的房间里有一把椅子。</p>
