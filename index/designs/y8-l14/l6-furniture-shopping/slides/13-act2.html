  <p class="section-label">活动二 · 一个当客人，一个当店员</p>
  <div class="stack" style="gap:6pt;">
    <div class="sc-row" style="padding:8pt 14pt;"><p class="sc-num" style="font-size:19pt;min-width:19pt;">1</p><div><p class="sc-main">老师发给每组一张纸条，上面四样东西</p><p class="sc-cn">每组的四样不一样</p></div></div>

    <div class="sc-row" style="padding:8pt 14pt;"><p class="sc-num" style="font-size:19pt;min-width:19pt;">3</p><div><p class="sc-main">回答不能只说数字，要说一整句</p><p class="sc-cn">✗ 三楼　　✓ 请上三楼。</p></div></div>
    <div class="sc-row" style="padding:8pt 14pt;"><p class="sc-num" style="font-size:19pt;min-width:19pt;">4</p><div><p class="sc-main">老师走动，把楼层表从说得出来的那组收走</p><p class="sc-cn">留给还需要看的那组</p></div></div>
  </div>
  <p class="support" style="margin-top:8pt;">纸条提前写好——每组四样，从十五个词里挑。</p>
