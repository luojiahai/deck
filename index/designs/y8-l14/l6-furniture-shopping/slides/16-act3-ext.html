  <p class="section-label">活动三 · 加难</p>
  <div class="task-box">
    <p class="task-line">不说图上的房子——说<b>你自己家</b>，而且要站起来对全班说满一分钟，不看纸。</p>
    <p class="task-line">开头先说房子（第十三课：层、楼上、楼下），</p>
    <p class="task-line">每个房间用「有」请东西进来，至少三样东西用「在」摆好位置，</p>
    <p class="task-line">最后用「不算大」或者「特别」下一个判断。</p>
    <p class="task-line">说完，接受全班两个「V 不 V」提问，并且回答。</p>
    <p class="task-cn" style="margin-top:10pt;">我家的房子有两层，楼下有客厅和厨房……我的房间不算大，可是我特别喜欢。</p>
