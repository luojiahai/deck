  <p class="section-label">活动一 · 加难</p>
  <div class="task-box">
    <p class="task-line">不要画你自己的客厅——写一个你去过、又不能改的：爷爷奶奶家的、医院的等候室、学校图书馆。</p>
    <p class="task-line">写成<b>一段话</b>，不是四条分开的句子：五句连起来，每一句说这一样在上一样的哪边。</p>
    <p class="task-line">最后一句说大小，要用「特别」。</p>
    <p class="task-line">写的时候不看总览页。</p>
    <p class="task-cn" style="margin-top:10pt;">沙发在电视柜前面，茶几在沙发前面……客厅特别大。</p>
