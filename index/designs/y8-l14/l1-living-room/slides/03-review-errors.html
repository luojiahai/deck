<!DOCTYPE html>
<html lang="zh-CN"><head>
<meta charset="UTF-8">
<title>Y8 L14 · Review · 有 or 在</title>
<link rel="stylesheet" href="../../shared/tokens.css">
</head>
<body>
<div class="slide-header">
  <span class="lesson-tag">0–8 MIN · REVIEW</span>
  <span class="sep"></span>
  <span class="section-name">复习 · 有 还是 在</span>
  <span class="slide-num">3 / 23</span>
  <div class="accent-line"></div>
</div>
<div class="slide-content">
  <p class="section-label">改一改 · 哪里错了？</p>
  <div class="stack" style="gap:2pt;">
    <div class="err-row"><div class="err-wrong"><p>我的房间有楼上。</p></div><span class="err-arrow">&rsaquo;</span><div class="err-right"><p>我的房间在楼上。</p></div><p class="support" style="margin-left:6pt;">房间是已知的，问的是在哪儿 → 在</p></div>
    <div class="err-row"><div class="err-wrong"><p>楼上在三间卧室。</p></div><span class="err-arrow">&rsaquo;</span><div class="err-right"><p>楼上有三间卧室。</p></div><p class="support" style="margin-left:6pt;">楼上是已知的，卧室是新的 → 有</p></div>
  </div>
  <p class="support" style="margin-top:10pt;">规律：<b>新的东西进已知的地方，用「有」；已知的东西找地方，用「在」。</b>这两个字今天还会回来。</p>
</div>
</body></html>
