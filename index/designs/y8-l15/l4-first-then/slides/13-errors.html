<div class="slide-header">

<div class="slide-content">
  <p class="section-label">改一改 · 「先……，然后……」最常见的两个错</p>
  <div class="stack" style="gap:2pt;">
    <div class="err-row"><div class="err-wrong"><p>我坐船先，坐公共汽车然后。</p></div><span class="err-arrow">&rsaquo;</span><div class="err-right"><p>我<b>先</b>坐船，<b>然后</b>坐公共汽车。</p></div><p class="support" style="margin-left:6pt;">「先」「然后」都在动词前面——跟昨天的「就」一样</p></div>
    <div class="err-row"><div class="err-wrong"><p>我先坐船，然后我坐公共汽车。</p></div><span class="err-arrow">&rsaquo;</span><div class="err-right"><p>我先坐船，然后坐公共汽车。</p></div><p class="support" style="margin-left:6pt;">主语说过一次就够了，第二个「我」多余</p></div>
  </div>
</div>
