<div class="slide-header">
  <span class="lesson-tag">10–20 MIN · I DO</span>

</div>
<div class="slide-content">
  <p class="section-label">例句 · See them used</p>
  <div class="sentence-list">
    <div class="sentence-row">
      <p class="sentence-cn">我先走路，<b>然后</b>坐五路公共汽车。</p>
      <p class="sentence-en">First I walk, then I take the number 5 bus.</p>
    </div>
    <div class="sentence-row">
      <p class="sentence-cn">我先坐船，<b>然后</b>坐火车去电影院。</p>
      <p class="sentence-en">First the boat, then the train to the cinema.</p>
    </div>
    <div class="sentence-row both">
      <p class="sentence-cn">我先坐公共汽车，<b>然后</b>走路十分钟就到了。</p>
      <p class="sentence-en">First the bus, then ten minutes on foot and I'm there.</p>
    </div>
  </div>
  <p class="support" style="margin-top:10pt;">问：「先」在前，「然后」在后——两个都在动词前面。</p>
</div>
