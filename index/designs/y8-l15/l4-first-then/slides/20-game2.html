<!DOCTYPE html>
<html lang="zh-CN"><head>
<meta charset="UTF-8">
<title>Y8 L15 · Game 2 · Telephone 传声筒 (7 min)</title>

</head>
<body>
<div class="slide-header">
  <span class="lesson-tag">20–43 MIN · FLEXIBLE PRACTICE · GAMES</span>
  <span class="sep"></span>
  <span class="section-name">游戏二 · 传声筒 · 7 分钟</span>
  <span class="slide-num">20 / 25</span>
  <div class="accent-line"></div>
</div>
<div class="slide-content">
  <p class="section-label">游戏二 · 传声筒</p>
  <div class="task-box">
    <p class="task-line">六个人一排。老师悄悄告诉每排第一个人一句<b>两段路</b>的话。</p>
    <p class="task-line">一个一个往下传，只能小声说，不能写。</p>
    <p class="task-line">最后一个人写在小白板上举起来。跟原句最像的那一排赢。</p>
    <p class="task-line">三轮，三句不同的话，每句都有「然后」加一个今天的词。</p>
    <p class="task-cn" style="margin-top:10pt;">我先坐船，然后坐十路公共汽车去电影院。</p>
  </div>
  <div class="extension-box">
    <p class="extension-label">Extension</p>
    <p class="extension-text">第四轮：赢的那一排最后一个人<b>自己编</b>一句来传——里面必须有「先……，然后……」、一个车号、一个地点，而且别人质疑的时候他要能<b>写对</b>。</p>
  </div>
</div>
</body></html>
