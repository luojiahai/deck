<div class="slide-header">

<div class="slide-content">
  <p class="section-label">例句 · See them used</p>
  <div class="sentence-list">
    <div class="sentence-row">
      <p class="sentence-cn">我家附近有一条大<b>马路</b>。</p>
      <p class="sentence-en">There's a big road near my home.</p>
    </div>
    <div class="sentence-row">
      <p class="sentence-cn">花店在超市<b>对面</b>。</p>
      <p class="sentence-en">The flower shop is opposite the supermarket.</p>
    </div>
    <div class="sentence-row both">
      <p class="sentence-cn"><b>马路对面</b>有一个花店。</p>
      <p class="sentence-en">There's a flower shop across the road.</p>
    </div>
  </div>
  <p class="support" style="margin-top:10pt;">问：「对面」跟第十三课的「左面」「右面」是一家的——最后一个字都是「面」。</p>
