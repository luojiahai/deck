      <p class="task-line"><b>两人一组</b>　每组一张 A3 地图，屏幕上也是同一张。</p>
      <p class="task-line">A 问：<b>超市在哪儿？</b> B 答，答案里<b>一定要有「就」</b>。</p>
      <p class="task-line">地图上八个地方，一人问四次，然后换。</p>
      <p class="task-line">最后全班一起：老师指一个地方，全班齐声回答。</p>
      <p class="task-cn" style="margin-top:10pt;">超市在哪儿？　—— 就在马路对面。／就在花店右面。</p>
