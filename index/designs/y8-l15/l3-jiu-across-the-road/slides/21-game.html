<body>
<div class="slide-header">
  <span class="lesson-tag">20–43 MIN · FLEXIBLE PRACTICE</span>

  <span class="section-name">游戏 · 句子拼图</span>

</div>
<div class="slide-content">
  <p class="section-label">游戏 · 句子拼图 · 7 分钟</p>
  <div class="task-box">
    <p class="task-line">四人一组，一个信封。信封里是六个句子，剪成了一个词一张。</p>
    <p class="task-line">六个句子都带「就」，用的都是今天的词。</p>
    <p class="task-line">哪一组先把六句全部摆对，哪一组赢。</p>
    <p class="task-cn" style="margin-top:10pt;">火车站 / 就 / 在 / 马路 / 对面　　走路 / 五 / 分钟 / 就 / 到了</p>
  </div>
  <div class="extension-box">
    <p class="extension-label">Extension</p>
    <p class="extension-text">强的那一组换信封：里面只有<b>四</b>句的卡片，却多了三张<b>哪一句都不属于</b>的干扰卡（一个 / 很 / 了）。四句摆对，还要<b>用中文</b>说出每一张多余的卡为什么放不进去。</p>
  </div>
</div>
