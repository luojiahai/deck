<body>
<div class="slide-header">
  <span class="lesson-tag">10–20 MIN · I DO</span>
  <span class="sep"></span>
  <span class="section-name">句型 · Sentence pattern</span>
  <span class="slide-num">12 / 24</span>
  <div class="accent-line"></div>
</div>
<div class="slide-content">
  <p class="section-label">句型 · 「就」放在动词<b>前面</b></p>
  <div class="pattern-box"><p class="pattern-text">……　就　+　动词　……</p></div>
  <div class="stack gap-md" style="margin-top:10pt;">
    <div class="sc-row"><p class="sc-num">1</p><div><p class="task-cn">超市<b>就</b>在我家附近。</p><p class="sc-main" style="margin-top:3pt;">The supermarket is <i>right</i> near my home.</p></div></div>
    <div class="sc-row"><p class="sc-num">2</p><div><p class="task-cn">火车站<b>就</b>在马路对面。</p><p class="sc-main" style="margin-top:3pt;">The station is <i>just</i> across the road.</p></div></div>
    <div class="sc-row"><p class="sc-num">3</p><div><p class="task-cn">走路五分钟<b>就</b>到了。</p><p class="sc-main" style="margin-top:3pt;">Five minutes on foot and you're <i>there</i>.</p></div></div>
  </div>
  <p class="support" style="margin-top:10pt;">「就」没有一个对得上的英文字。它做的事是<b>强调</b>：近得出乎意料，快得出乎意料。</p>
</div>
</body></html>
