<body>
<div class="slide-header">
  <span class="lesson-tag">10–20 MIN · I DO</span>

  <span class="slide-num">13 / 24</span>
  <div class="accent-line"></div>
</div>
<div class="slide-content">
  <p class="section-label">改一改 · 「就」最常见的两个错</p>
  <div class="stack" style="gap:2pt;">
    <div class="err-row"><div class="err-wrong"><p>走路五分钟到了就。</p></div><span class="err-arrow">&rsaquo;</span><div class="err-right"><p>走路五分钟<b>就</b>到了。</p></div><p class="support" style="margin-left:6pt;">「就」在动词前面，跟「先」「也」一样</p></div>
    <div class="err-row"><div class="err-wrong"><p>火车站在就马路对面。</p></div><span class="err-arrow">&rsaquo;</span><div class="err-right"><p>火车站<b>就在</b>马路对面。</p></div><p class="support" style="margin-left:6pt;">是「就在」，不是「在就」</p></div>
  </div>
  <p class="support" style="margin-top:10pt;">手指指黑板：「就」该放在哪一半？全班一起指。</p>
</div>
