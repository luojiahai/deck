<div class="slide-content">
  <p class="section-label">句型 · 说两个地方有多远</p>
  <div class="pattern-box"><p class="pattern-text">地方一 + 离 + 地方二 + 远／近</p></div>
  <div class="stack gap-md" style="margin-top:10pt;">
    <div class="sc-row"><p class="sc-num">1</p><div><p class="task-cn">超市<b>离</b>我家很<b>近</b>。</p><p class="sc-main" style="margin-top:3pt;">The supermarket is very close to my home.</p></div></div>
    <div class="sc-row"><p class="sc-num">2</p><div><p class="task-cn">我家<b>离</b>学校不<b>远</b>。</p><p class="sc-main" style="margin-top:3pt;">My home isn't far from school.</p></div></div>
    <div class="sc-row"><p class="sc-num">3</p><div><p class="task-cn">花店<b>离</b>我家<b>挺近的</b>。</p><p class="sc-main" style="margin-top:3pt;">The flower shop is quite close to my home. — 挺 + adj + 的</p></div></div>
  </div>
  <p class="support" style="margin-top:10pt;">问句：<b>你家离学校远吗？</b> 答：<b>挺远的。／不远。</b></p>
