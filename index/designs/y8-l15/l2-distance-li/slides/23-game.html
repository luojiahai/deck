<div class="slide-content">
  <p class="section-label">游戏 · 远近宾果 · 7 分钟</p>
  <div class="task-box">
    <p class="task-line">自己画一个三乘三的格子，填九个地方：超市、花店、文具店、家具店、饭店、学校、火车站、我家、公园。</p>
    <p class="task-line">老师念一句：<b>这个地方离学校很远，要坐火车去。</b></p>
    <p class="task-line">你觉得是哪个，就划掉哪个。连成一线就喊「宾果」。</p>
  </div>
  <div class="extension-box">
    <p class="extension-label">Extension</p>
    <p class="extension-text">赢的人接着当<b>发牌的</b>：自己<b>现编</b>中文提示，每一句都要有「离」，还要有一句用「挺……的」。其他人格子不换，接着玩。</p>
  </div>
</div>
