<body>
<div class="slide-header">
  <span class="lesson-tag">10–20 MIN · I DO</span>

  <span class="section-name">句型 · 最常见的错</span>
  <span class="slide-num">13 / 26</span>
  <div class="accent-line"></div>
</div>
<div class="slide-content">
  <p class="section-label">改一改 · 「离」最常见的两个错</p>
  <div class="stack" style="gap:2pt;">
    <div class="err-row"><div class="err-wrong"><p>我家离学校。</p></div><span class="err-arrow">&rsaquo;</span><div class="err-right"><p>我家离学校很远。</p></div><p class="support" style="margin-left:6pt;">「离」后面一定要有「远」或者「近」——它不是动词</p></div>
    <div class="err-row"><div class="err-wrong"><p>我离家学校很远。</p></div><span class="err-arrow">&rsaquo;</span><div class="err-right"><p>我家离学校很远。</p></div><p class="support" style="margin-left:6pt;">两个地方各自是完整的：我家 / 离 / 学校</p></div>
  </div>
  <p class="support" style="margin-top:10pt;">这两句今天会在小白板上出现很多次。现在看清楚，等一下就少写一次。</p>
</div>
