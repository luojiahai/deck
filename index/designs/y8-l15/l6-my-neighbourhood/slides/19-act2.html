  <div class="figure-wrap">
    <div class="fig"><img src="../../img/zhilu.svg" alt=""></div>
    <div class="fig-body">
      <p class="task-line">两人一组，用那张 A3 地图。一个坐<b>问讯处</b>，一个是<b>刚下车的客人</b>。</p>
      <p class="task-line">客人要问<b>五个</b>地方，每个地方都要问到三件事：</p>
      <p class="task-line">① 在哪儿？　② 怎么去？　③ 要多长时间？</p>
      <p class="task-line">四分半换角色。</p>
      <p class="task-cn" style="margin-top:10pt;">请问，电影院在哪儿？　—— 电影院就在马路对面。<br>从这儿怎么去超市？　—— 你先走路，然后坐五路公共汽车。<br>要多长时间？　—— 大约十五分钟。</p>
