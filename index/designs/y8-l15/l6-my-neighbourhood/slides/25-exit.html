<div class="slide-content">
  <p class="section-label">出门条 · 写三句你自己的社区，交上来</p>
  <div class="task-box">
    <p class="task-line">第一句用<b>「附近有……等」</b>。</p>
    <p class="task-line">第二句用<b>「离……远／近」</b>。</p>
    <p class="task-line">第三句用<b>「先……，然后……」</b>。</p>
    <p class="task-cn" style="margin-top:10pt;">三句都写对的那几张，就是单元测验写作部分的样子——下节课带回来。</p>
  </div>
  <div class="extension-box">
    <p class="extension-label">Extension</p>
    <p class="extension-text">写完了？再写第四句，用「就」。</p>
  </div>
