  <div class="task-box">
    <p class="task-line">不写两句，写<b>五句</b>，而且要写成一封给朋友的信。</p>
    <p class="task-line">「你好」开头；「附近有……等」「离……挺远的」「先……，然后……」各至少用一次；最后推荐一个地方，还要说为什么。</p>
    <p class="task-line">这就是练习册那篇社区作文，也是<b>单元测验第十一部分</b>——现在先写一遍，而且是当众写。</p>
