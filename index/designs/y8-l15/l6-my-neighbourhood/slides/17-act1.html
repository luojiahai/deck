  <div class="figure-wrap">
    <div class="fig"><img src="../../img/ditu.svg" alt=""></div>
    <div class="fig-body">
      <p class="task-line"><b>三人一组</b>，每组一张 A3 地图，屏幕上是同一张。</p>
      <p class="task-line">轮流说，一人一句——<b>句型不能重复</b>。</p>
      <p class="task-line">所以一组要凑齐：附近有……等 / 离……远近 / 就在……对面 / 挺……的 / 先……，然后……。每组至少六句。</p>
      <p class="task-line">然后全班：老师指一个店，全班齐声答<b>那是什么店？</b></p>
      <p class="task-cn" style="margin-top:10pt;">超市离学校很近，走路三分钟就到了。</p>
