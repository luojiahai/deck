    <div class="sc-row" style="padding:8pt 14pt;"><p class="sc-num" style="font-size:19pt;min-width:19pt;">1</p><div><p class="sc-main">两人一组，一张 A3。四分钟，画至少<b>八个</b>地方，全部写汉字，其中至少六个是这六课学过的店。</p></div></div>

    <div class="sc-row" style="padding:8pt 14pt;"><p class="sc-num" style="font-size:19pt;min-width:19pt;">3</p><div><p class="sc-main">全部贴到墙上。两分钟大家走一圈，在<b>最想去</b>的那一张旁边打一个勾。</p></div></div>
    <div class="sc-row" style="padding:8pt 14pt;"><p class="sc-num" style="font-size:19pt;min-width:19pt;">4</p><div><p class="sc-main">票最多的两组把他们写的两句念出来。</p></div></div>
