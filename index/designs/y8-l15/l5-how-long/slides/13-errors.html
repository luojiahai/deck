  <p class="section-label">改一改 · 「多长时间」和「大约」</p>
  <div class="stack" style="gap:2pt;">
    <div class="err-row"><div class="err-wrong"><p>你要多长时间坐？</p></div><span class="err-arrow">&rsaquo;</span><div class="err-right"><p>你要坐<b>多长时间</b>？</p></div><p class="support" style="margin-left:6pt;">「多长时间」在动词后面——它是问「坐多久」，不是问「多久坐」</p></div>
    <div class="err-row"><div class="err-wrong"><p>大约二十分钟的时间要坐。</p></div><span class="err-arrow">&rsaquo;</span><div class="err-right"><p>要坐<b>大约</b>二十分钟。</p></div><p class="support" style="margin-left:6pt;">「大约」贴在数量前面</p></div>
  </div>
