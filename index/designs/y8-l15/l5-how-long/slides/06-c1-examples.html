  <div class="sentence-list">
    <div class="sentence-row">
      <p class="sentence-cn">你要坐多长<b>时间</b>？</p>
      <p class="sentence-en">How long do you have to travel?</p>
    </div>
    <div class="sentence-row">
      <p class="sentence-cn"><b>大约</b>二十分钟。</p>
      <p class="sentence-en">About twenty minutes.</p>
    </div>
    <div class="sentence-row both">
      <p class="sentence-cn">从我家到学校要多长<b>时间</b>？　—— <b>大约</b>半个小时。</p>
      <p class="sentence-en">How long from my home to school? — About half an hour.</p>
    </div>
  </div>
  <p class="support" style="margin-top:10pt;">问：「时间」说的是一段，不是一个点——钟面上那个箭头扫过的一块。</p>
