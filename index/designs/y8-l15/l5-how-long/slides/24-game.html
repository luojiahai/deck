</head>
<body>
<div class="slide-header">
  <span class="lesson-tag">20–43 MIN · FLEXIBLE PRACTICE</span>
  <span class="sep"></span>
  <span class="section-name">游戏 · 二十个问题 · 7 分钟</span>
  <span class="slide-num">24 / 27</span>
  <div class="accent-line"></div>
</div>
<div class="slide-content">
  <p class="section-label">游戏 · 猜一个地方</p>
  <div class="task-box">
    <p class="task-line">一个同学心里想一个地方：超市、花店、文具店、家具店、饭店、火车站、电影院、机场、学校。</p>
    <p class="task-line">全班<b>只能用中文</b>问：离学校远吗？要坐多长时间？在马路对面吗？那儿有沙发吗？</p>
    <p class="task-line">他只能答：是／不是／挺远的／大约二十分钟。</p>
    <p class="task-line">二十个问题之内猜出来算全班赢。</p>
  </div>
  <div class="extension-box">
    <p class="extension-label">Extension</p>
    <p class="extension-text">想地方的人<b>不许只答一个词</b>——每一句都要是完整的句子，而且整轮里至少有三句要用「先……，然后……」。问的人：同一个问法不能用第二次。</p>
  </div>
</div>
</body></html>
