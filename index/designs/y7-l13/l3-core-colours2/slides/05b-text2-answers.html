<!DOCTYPE html>
<html lang="zh-CN"><head>
<meta charset="UTF-8">
<title>L3-05b · Text 2 Answers</title>
<link rel="stylesheet" href="../../shared/tokens.css">
<style>
  .slide-content { justify-content:flex-start; padding:36px 100px 32px; }
  .section-label { font-size:16px; font-weight:700; letter-spacing:0.14em; color:var(--accent-gold); text-transform:uppercase; margin-bottom:10px; }
  .main-title { font-family:var(--font-display); font-size:46px; font-weight:900; margin-bottom:28px; }

  .answers-list { display:flex; flex-direction:column; gap:22px; }
  .answer-item { display:grid; grid-template-columns:auto 1fr; gap:24px; align-items:start; background:var(--bg-secondary); border-radius:var(--radius-lg); border:1px solid var(--border-light); padding:24px 28px; }
  .answer-num { width:44px; height:44px; border-radius:50%; background:var(--accent-gold); color:#fff; display:flex; align-items:center; justify-content:center; font-size:22px; font-weight:900; flex-shrink:0; }
  .answer-body .q { font-size:19px; color:var(--text-muted); margin-bottom:12px; }
  .answer-body .answer-box { background:var(--accent-gold-dim); border:2px solid var(--accent-gold); border-radius:var(--radius-md); padding:14px 22px; display:inline-flex; align-items:center; gap:10px; }
  .answer-body .answer-zh { font-family:var(--font-display); font-size:26px; font-weight:900; color:var(--text-primary); }
  .answer-body .tick { font-size:20px; }
  .answer-body .dot { width:22px; height:22px; border-radius:50%; border:2px solid rgba(0,0,0,0.12); }
</style>
</head>
<body>

<div class="slide-header">
  <div class="lesson-tag"><p style="margin: 0px; padding: 0px;">L3 · CORE COLOURS 2</p></div>
  <span class="sep" style="margin: 0px;"></span>
  <div class="section-name"><p style="margin: 0px; padding: 0px;">I Do · Text 2 Answers ↳</p></div>
  <div class="accent-line" style="background:var(--accent-gold);"></div>
</div>

<div class="slide-content">
  <div class="section-label"><p style="margin: 0px; padding: 0px;">Answers Revealed · 答案</p></div>
  <div class="main-title"><p style="margin: 0px; padding: 0px;">答案 · Text 2 Comprehension</p></div>

  <div class="answers-list">
    <div class="answer-item">
      <div class="answer-num"><p style="margin: 0px; padding: 0px;">1</p></div>
      <div class="answer-body">
        <div class="q"><p style="margin: 0px; padding: 0px;">B喜欢哪几个颜色？</p></div>
        <div class="answer-box">
          <div class="dot" style="background:var(--swatch-orange);"></div>
          <div class="dot" style="background:var(--swatch-purple);"></div>
          <div class="dot" style="background:var(--swatch-brown);"></div>
          <div class="dot" style="background:var(--swatch-green);"></div>
          <div class="answer-zh"><p style="margin: 0px; padding: 0px;"><span class="tick" style="margin: 0px;">✅</span> 橙色、紫色、棕色、绿色</p></div>
        </div>
      </div>
    </div>
    <div class="answer-item">
      <div class="answer-num"><p style="margin: 0px; padding: 0px;">2</p></div>
      <div class="answer-body">
        <div class="q"><p style="margin: 0px; padding: 0px;">A和B都喜欢灰色吗？</p></div>
        <div class="answer-box">
          <div class="answer-zh"><p style="margin: 0px; padding: 0px;"><span class="tick" style="margin: 0px;">✅</span> 都不喜欢 <span style="font-family:var(--font-body); font-weight:400; font-size:16px; color:var(--text-secondary);">— both dislike it</span></p></div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="slide-footer">
  <div class="brand"><p style="margin: 0px; padding: 0px;">Y7 Chinese · Unit 5 Colours 颜色</p></div>
</div>

</body></html>
