<div class="slide-content">

  <div class="ex-list" style="gap:18px;">
    <div class="ex-row" style="flex-direction:row;gap:20px;align-items:baseline;">
      <span class="sc-num">1</span>
      <div class="body-lg" style="color:var(--text-primary);">每人一张表，每一格找一个<b>不同</b>的同学，问到了就写名字。</div>
    </div>
    <div class="ex-row" style="flex-direction:row;gap:20px;align-items:baseline;">
      <span class="sc-num">2</span>
      <div class="body-lg" style="color:var(--text-primary);">只能用中文问 — 用英文问不算。</div>

  </div>
  <div class="card" style="margin-top:24px;padding:24px 32px;">
    <div class="ex-list" style="gap:10px;">

      <div class="ex-row"><div class="ex-hanzi">……坐黄色的校车　·　……喜欢天蓝色　·　……跟你喜欢一样的颜色</div></div>
      <div class="ex-row"><div class="ex-hanzi">你喜欢紫色吗？　你爸爸喜欢什么颜色？</div></div>

  <div style="margin-top:20px;">
    <div class="extension-box">
      <span class="ext-label">更难</span>
      <span class="ext-body">每个名字后面还要写一个追问的答案，不能只打勾。最后用「也」向全班报告两条 — <span class="cn">她喜欢紫色，我也喜欢紫色。</span></span>
    </div>
  </div>
