<!DOCTYPE html>
<!DOCTYPE html><html lang="zh-CN"><head>
<meta charset="UTF-8">
<title>L1-05b · Text 1 Answers</title>
<link rel="stylesheet" href="../../shared/tokens.css">
<style>
  .slide-content { justify-content:center; padding:56px 140px; }
  .section-label { font-size:16px; font-weight:700; letter-spacing:0.14em; color:var(--accent-gold); text-transform:uppercase; margin-bottom:12px; }
  .main-title { font-family:var(--font-display); font-size:50px; font-weight:900; margin-bottom:32px; }
  .cfu-list { display:flex; flex-direction:column; gap:20px; }
  .cfu-item { display:grid; grid-template-columns:auto 1fr; gap:20px; align-items:start; background:var(--bg-secondary); border-radius:var(--radius-lg); border:1px solid var(--border-light); padding:20px 28px; }
  .cfu-num { width:44px; height:44px; border-radius:50%; background:var(--accent-gold); color:#fff; display:flex; align-items:center; justify-content:center; font-size:22px; font-weight:900; flex-shrink:0; }
  .cfu-body .q { font-size:19px; color:var(--text-muted); margin-bottom:8px; }
  .cfu-body .answer { font-size:24px; color:var(--accent-gold); font-weight:700; font-family:var(--font-display); line-height:1.4; display:flex; align-items:center; gap:10px; }
  .cfu-body .answer-en { font-size:16px; color:var(--text-secondary); margin-top:4px; }
  .ans-dot { width:20px; height:20px; border-radius:50%; border:2px solid rgba(0,0,0,0.12); flex-shrink:0; }
</style>
</head>
<body>

<div class="slide-header">
  <div class="lesson-tag"><p style="margin: 0px; padding: 0px;">L1 · CORE COLOURS 1</p></div>
  <span class="sep" style="margin: 0px;"></span>
  <div class="section-name"><p style="margin: 0px; padding: 0px;">I Do · Text 1 Answers ↳</p></div>
  <div class="accent-line" style="background:var(--accent-gold);"></div>
</div>

<div class="slide-content">
  <div class="section-label"><p style="margin: 0px; padding: 0px;">Answers Revealed · 答案</p></div>
  <div class="main-title"><p style="margin: 0px; padding: 0px;">答案 · Text 1 Comprehension</p></div>

  <div class="cfu-list">
    <div class="cfu-item">
      <div class="cfu-num"><p style="margin: 0px; padding: 0px;">1</p></div>
      <div class="cfu-body">
        <div class="q"><p style="margin: 0px; padding: 0px;">爸爸喜欢什么颜色？</p></div>
        <div class="answer">
          <div class="ans-dot" style="background:var(--swatch-black);"></div>
          <div class="ans-dot" style="background:var(--swatch-white);"></div>
          <p style="margin: 0px; padding: 0px;">黑色和白色 (black and white)</p>
        </div>
      </div>
    </div>
    <div class="cfu-item">
      <div class="cfu-num"><p style="margin: 0px; padding: 0px;">2</p></div>
      <div class="cfu-body">
        <div class="q"><p style="margin: 0px; padding: 0px;">谁喜欢红色？</p></div>
        <div class="answer">
          <div class="ans-dot" style="background:var(--swatch-red);"></div>
          <p style="margin: 0px; padding: 0px;">姐姐 (older sister)</p>
        </div>
        <div class="answer-en"><p style="margin: 0px; padding: 0px;">爸爸=black/white, 妈妈=yellow, 哥哥=blue, 姐姐=red, 我=pink</p></div>
      </div>
    </div>
    <div class="cfu-item">
      <div class="cfu-num"><p style="margin: 0px; padding: 0px;">3</p></div>
      <div class="cfu-body">
        <div class="q"><p style="margin: 0px; padding: 0px;">我喜欢什么颜色？</p></div>
        <div class="answer">
          <div class="ans-dot" style="background:var(--swatch-pink);"></div>
          <p style="margin: 0px; padding: 0px;">粉红色 (pink)</p>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="slide-footer">
  <div class="brand"><p style="margin: 0px; padding: 0px;">Y7 Chinese · Unit 5 Colours 颜色</p></div>
</div>



</body></html>
