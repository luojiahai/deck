<style>
  body { display:flex; align-items:center; justify-content:center; background:var(--bg-primary); overflow:hidden; }

  .unit-tag.next .u-label { color:var(--accent-vermillion); }
  .unit-tag .u-title { font-family:var(--font-display); font-size:32px; font-weight:900; color:var(--text-primary); }
  .big-arrow { font-size:40px; color:var(--text-muted); }
