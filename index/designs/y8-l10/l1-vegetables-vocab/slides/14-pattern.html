<body>
<div class="slide-header">
  <span class="lesson-tag">10–20 MIN · I DO</span>

  <span class="slide-num">14 / 19</span>
  <div class="accent-line"></div>
</div>
<div class="slide-content">
  <p class="section-label">句型 · Key sentence pattern</p>
  <div class="pattern-box">
    <p class="pattern-text">你喜欢吃什么<b>蔬菜</b>？ → 我喜欢吃……。</p>

  </div>
  <div class="example-list" style="margin-top:36px">

      <p class="example-num">1</p>
      <div><p class="example-cn">你喜欢吃什么蔬菜？ — 我喜欢吃黄瓜。</p></div>
    </div>
    <div class="example-row">
      <p class="example-num">2</p>
      <div><p class="example-cn">你喜欢吃什么蔬菜？ — 我喜欢吃生菜和土豆。</p></div>
    </div>
    <div class="example-row">
      <p class="example-num">3</p>
      <div><p class="example-cn">我最喜欢吃黄瓜，不太喜欢吃菜花儿。</p></div>
    </div>
    <div class="example-row hardest">
      <p class="example-num">4</p>
      <div><p class="example-cn">除了生菜以外，我还喜欢吃西红柿和土豆。</p><p class="example-en">Two structures, three vegetables — the hardest one.</p></div>
    </div>
  </div>

</div>
